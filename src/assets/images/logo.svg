<svg width="160" height="32" viewBox="0 0 160 32" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Liberty logo — navbar size</title>
  <desc>Compact 32px Liberty logo for website navigation.</desc>

  <defs>
    <style>
      .wordmark { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-weight: 700; fill: #1a2e4a; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Flame -->
  <path d="M16,2 C10,6 12,14 12,16 C9,11 6,9 8,5 C5,9 6,16 11,19 C10,16 11,13 13,15 C13,18 14,21 16,22 C18,21 19,18 19,15 C21,13 22,16 21,19 C26,16 27,9 24,5 C26,9 23,11 20,16 C20,14 22,6 16,2Z" fill="#c9a84c"/>
  <path d="M16,7 C13,10 13,15 14,17 C12,14 11,12 12,9 C10,12 11,17 14,20 C13,17 14,15 15,16 C15,18 16,20 16,21 C16,20 17,18 17,16 C18,15 19,17 18,20 C21,17 22,12 20,9 C21,12 20,14 18,17 C19,15 19,10 16,7Z" fill="#e8c46a"/>

  <!-- Crown -->
  <polygon points="16,1 15,4 17,4" fill="#1a2e4a"/>
  <polygon points="11,2 10,5 13,5" fill="#1a2e4a"/>
  <polygon points="21,2 19,5 22,5" fill="#1a2e4a"/>
  <rect x="10" y="4" width="12" height="3" rx="1" fill="#1a2e4a"/>
  <circle cx="16" cy="1" r="1" fill="#c9a84c"/>
  <circle cx="11" cy="2" r="1" fill="#c9a84c"/>
  <circle cx="21" cy="2" r="1" fill="#c9a84c"/>

  <!-- Torch cup -->
  <path d="M11,24 Q11,21 16,21 Q21,21 21,24 L20,27 L12,27 Z" fill="#1a2e4a"/>
  <rect x="12" y="26" width="8" height="2" rx="1" fill="#c9a84c"/>

  <!-- Stem -->
  <rect x="14" y="27" width="4" height="5" rx="1" fill="#1a2e4a"/>

  <!-- Liberty wordmark -->
  <text x="30" y="24" text-anchor="start" class="wordmark">Liberty</text>

</svg>
