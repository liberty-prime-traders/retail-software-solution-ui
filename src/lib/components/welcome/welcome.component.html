<div class="flex flex-column h-full">
  <div class="w-full flex justify-content-between p-3">
    @if (isLoggedIn$ | async) {
      @if (sessionContextService.selectedOrganization()) {
        <div class="flex gap-2">
          <p-avatar [label]="userInitials()" shape="circle"/>
          <div class="flex flex-column gap-1">
            <span class="font-semibold text-2xl">{{sessionContextService.selectedOrganization()?.name}}</span>
            @if (sessionContextService.selectedLocation()) {
              <span>{{sessionContextService.selectedLocation()?.name}}</span>
            }
          </div>
        </div>

        <p-menubar [model]="quickActionsMenu()" class="font-italic"/>
      }

      <div class="flex" [ngClass]="quickActionsMenuVisible() ? '' : 'flex-grow-1 justify-content-end'">
        <p-button icon="pi pi-user" label="Logout" (onClick)="logout()" severity="info"/>
      </div>

    } @else {
      <div class="flex flex-grow-1 justify-content-end">
        <p-button icon="pi pi-user" severity="secondary" label="Login" routerLink="/secure"/>
      </div>
    }

  </div>

  <p-divider></p-divider>

  <div class="flex-grow-1">
    <router-outlet/>
  </div>
</div>
