<rts-loading-container [loading]="isAuthenticating()" loadingText="Authenticating...">
  <div class="flex flex-column"
       id="welcome-screen"
       [padding]="0"
       rtsAutoStretch="welcome-screen"
       (onResize)="onResize()"
       [ngClass]="fullScreen() ? 'gap-1' : 'gap-4'">

    @if (fullScreen()) {
      <div class="flex justify-content-end p-1">
        <button pButton
                (click)="setFullScreen(false)"
                severity="secondary">
          <i class="pi pi-arrow-down-left-and-arrow-up-right-to-center"></i>
        </button>
      </div>

    } @else {
      <div class="w-full flex justify-content-between align-items-center">
        @if (isLoggedIn()) {
          <p-splitter gutterSize="1" class="border-noround flex-grow-1 p-2">
            <ng-template #panel>
              <img ngSrc="assets/images/logo.svg" alt="Logo" height="32" width="160" priority/>
            </ng-template>

            @if (isPlatformAdmin()) {
              <ng-template #panel>
                <rts-scope-pill [config]="PlatformPillConfig"/>
              </ng-template>
            }

            <ng-template #panel>
              <rts-scope-pill [config]="OrganizationPillConfig">
                <rts-organization-nav-content/>
              </rts-scope-pill>
            </ng-template>

            <ng-template #panel>
              <rts-scope-pill [config]="LocationPillConfig">
                <rts-location-nav-content/>
              </rts-scope-pill>
            </ng-template>

            <ng-template #panel>
              <div class="flex h-full flex-grow-1 justify-content-center align-items-center">
                <rts-user-account-nav-content/>
              </div>
            </ng-template>
          </p-splitter>
        }
      </div>
    }

    <div class="relative">
      @if (!fullScreen()) {
        <div class="absolute position-right-17 position-top-1 z-1">
          <button pButton
                  (click)="setFullScreen(true)"
                  pTooltip="Full Screen"
                  size="small"
                  severity="secondary">
            <i class="pi pi-arrow-up-right-and-arrow-down-left-from-center"></i>
          </button>
        </div>
      }
      <router-outlet/>
    </div>
  </div>
</rts-loading-container>
