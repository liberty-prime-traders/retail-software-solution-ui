<div class="flex flex-column h-full">
  <div class="w-full flex justify-content-between p-3">
    <div>Welcome To Liberty</div>

    @if (isLoggedIn$ | async) {
      <p-button icon="pi pi-user" class="block" label="Logout" (onClick)="logout()" severity="info"/>
    } @else {
      <p-button icon="pi pi-user" severity="secondary" class="block" label="Login" routerLink="/landing"/>
    }
  </div>

  <p-divider></p-divider>

  <div class="flex-grow-1">
    <router-outlet/>
  </div>
</div>
