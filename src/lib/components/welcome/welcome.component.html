<div class="flex flex-column gap-4 h-full" (onResize)="onResize()">

  @if (fullScreen()) {
    <div class="flex justify-content-end p-1">
      <p-button icon="pi pi-arrow-down-left-and-arrow-up-right-to-center"
                (onClick)="setFullScreen(false)"
                severity="secondary">
      </p-button>
    </div>

  } @else {
    <div class="w-full flex justify-content-between align-items-center">
      @if (isLoggedIn$ | async) {
        <p-splitter gutterSize="1" class="border-noround flex-grow-1 p-2">
          <ng-template pTemplate="panel">
            <img ngSrc="assets/images/logo.svg" alt="Logo" height="32" width="160" priority/>
          </ng-template>

          <ng-template pTemplate="panel">
            <rts-scope-pill [config]="PlatformPillConfig"/>
          </ng-template>

          <ng-template pTemplate="panel">
            <rts-scope-pill [config]="OrganizationPillConfig">
              <rts-organization-nav-content/>
            </rts-scope-pill>
          </ng-template>

          <ng-template pTemplate="panel">
            <rts-scope-pill [config]="LocationPillConfig">
              <rts-location-nav-content/>
            </rts-scope-pill>
          </ng-template>

          <ng-template pTemplate="panel">
            <div class="flex h-full flex-grow-1 justify-content-center align-items-center">
              <rts-user-account-nav-content/>
            </div>
          </ng-template>
        </p-splitter>

      } @else {
        <div class="flex flex-grow-1 justify-content-end">
          <p-button icon="pi pi-user" severity="secondary" label="Login" routerLink="/secure"/>
        </div>
      }
    </div>
  }

  <div class="relative">
    @if (!fullScreen()) {
      <div class="absolute position-right-17 position-top-1 z-1">
        <p-button icon="pi pi-arrow-up-right-and-arrow-down-left-from-center"
                  (onClick)="setFullScreen(true)"
                  pTooltip="Full Screen"
                  size="small"
                  severity="secondary">
        </p-button>
      </div>
    }
    <router-outlet/>
  </div>
</div>
