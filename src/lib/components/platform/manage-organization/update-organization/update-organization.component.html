<form [formGroup]="organizationForm" class="mt-2">
  <rts-form-field for="name" label="Name" [required]="true" contentClass="col-8">
    <input id="name" pInputText formControlName="name"/>
  </rts-form-field>

  <rts-form-field for="description" label="Description" contentClass="col-8">
    <textarea id="description" pInputText formControlName="description" class="w-full"></textarea>
  </rts-form-field>

  <div class="flex justify-content-end col-11 p-0">
    <rts-forms-buttons [disableReset]="!organizationForm.dirty"
                       [disableSave]="!organizationForm.valid || !organizationForm.dirty"
                       [hideReset]="true"
                       [hideDelete]="true"
                       [processingStatus]="organizationProcessingStatus()"
                       [failureMessages]="organizationServiceFailureMessages()"
                       [saveLabel]="'Update'"
                       (save)="updateOrganization()"
                       (resetAction)="organizationForm.reset()">
    </rts-forms-buttons>
  </div>
</form>
