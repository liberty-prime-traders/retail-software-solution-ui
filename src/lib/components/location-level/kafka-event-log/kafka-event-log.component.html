<p-table [value]="kafkaLogs()"
         sortField="referenceNumber"
         [loading]="loading()"
         dataKey="id">

  <ng-template #caption>
    <div class="flex justify-content-between align-items-center">
      <h3 class="font-bold">Event Log</h3>
      <button pButton
              rounded
              severity="secondary"
              [disabled]="loading()"
              (click)="refreshAll()">
        <i class="pi pi-refresh"></i> Refresh All
      </button>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th>Reference Number</th>
      <th>Processor</th>
      <th>Status</th>
      <th>Processed On</th>
      <th>Failure Reason</th>
      <th style="width: 4rem"></th>
    </tr>
  </ng-template>

  <ng-template #body let-log>
    <tr>
      <td>{{ log.referenceNumber | nullSafe }}</td>
      <td>{{ log.processor | nullSafe }}</td>
      <td>{{ log.status | prettifyEnum }}</td>
      <td>{{ log.processedOn | date  | nullSafe }}</td>
      <td>{{ log.failureReason | nullSafe }}</td>
      <td>
        <button pButton
                rounded
                text
                severity="secondary"
                [disabled]="loading()"
                (click)="retry(log.id)">
          <i class="pi pi-replay"></i>
        </button>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr rts-empty-row [colspan]="6" message="No events found"></tr>
  </ng-template>

</p-table>
