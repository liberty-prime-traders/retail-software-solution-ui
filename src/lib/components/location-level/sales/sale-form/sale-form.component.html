<rts-loading-container [loading]="sessionIsLoading()">

  @if (showUnsavedCarts()) {
    <rts-open-sale-sessions />

  } @else {
    <div class="flex flex-column" id="sale-form" rtsAutoStretch="sale-form" [padding]="0">
      <rts-sale-form-header/>

      <div class="flex flex-grow-1">
        <div class="flex flex-column flex-grow-1 pt-3">
          <rts-form-field label="Customer" class="pl-3">
            @if (canEditCustomer()) {
              <div class="flex gap-2">
                <p-select
                  [options]="customers()"
                  optionLabel="fullName"
                  optionValue="id"
                  [filter]="true"
                  class="flex-grow-1"
                  (onChange)="onCustomerChange()"
                  [formField]="saleForm.contactId"
                  placeholder="Select a Customer">
                </p-select>

                <p-toggle-button
                  onLabel="Walk-In"
                  offLabel="Walk-In"
                  (onChange)="respondToWalkInCustomer($event.checked)"
                  [formField]="saleForm.walkInCustomer">
                </p-toggle-button>
              </div>

            } @else {
              {{ saleSession().contactLabel | nullSafe }}
            }
          </rts-form-field>

          <rts-sale-lines class="p-3 flex-grow-1"/>
        </div>

        <rts-sale-form-summary class="col-3 p-0"/>
      </div>
    </div>
  }

</rts-loading-container>
