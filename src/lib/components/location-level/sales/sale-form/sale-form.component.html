<rts-loading-container [loading]="saleIsLoading()">
  <div class="flex flex-column" id="sale-form" rtsAutoStretch="sale-form" [useMinHeight]="true">
    <rts-sale-form-header/>

    <div class="flex flex-grow-1 scrollable">
      <div class="flex flex-column flex-grow-1 pt-3">
        <rts-form-field label="Customer">
          @if (canEditCustomer()) {
            <div class="flex gap-2">
              <p-select
                [options]="customers()"
                optionLabel="fullName"
                optionValue="id"
                [filter]="true"
                class="flex-grow-1"
                [formField]="saleForm.contactId"
                placeholder="Select a Customer">
              </p-select>

              <p-toggle-button
                onLabel="Walk-In"
                offLabel="Walk-In"
                (onChange)="respondToWalkInCustomer($event.checked)"
                [formField]="saleForm.walkInCustomer">
              </p-toggle-button>
            </div>

          } @else {
           {{ originalSaleRecord()?.contactName | nullSafe }}
          }
        </rts-form-field>

        <rts-sale-lines class="p-3 flex-grow-1"/>

        @if (canVoidSale()) {
          <p-card class="border-noround">
            <rts-forms-buttons
              [hideSave]="true"
              [hideReset]="true"
              (delete)="voidSale()"
              contentClass=""
              deleteInProgressMessage="Processing request..."
              deleteWarning="All payments have been voided, and products have not been expended"
              [deleteLabel]="voidSaleLabel()">
            </rts-forms-buttons>
          </p-card>
        }
      </div>

      <rts-sale-payment-summary
        class="col-3 p-0"
        id="sale-payment-summary"
        rtsAutoStretch="sale-payment-summary"
        [useMinHeight]="true">
      </rts-sale-payment-summary>
    </div>


  </div>
</rts-loading-container>
