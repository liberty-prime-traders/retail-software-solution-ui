<button pButton
        type="button"
        size="small"
        severity="secondary"
        [disabled]="isPrinting()"
        (click)="printNow()">
  <i class="pi pi-print"></i> Print
</button>

<button pButton
        type="button"
        size="small"
        severity="secondary"
        text
        (click)="openPreview()">
  <i class="pi pi-eye"></i> Preview
</button>

@if (renderedOffScreenForPrint()) {
  <div class="sale-print-offscreen" aria-hidden="true">
    <ng-container [ngTemplateOutlet]="documentTemplate" />
  </div>
}

<ng-template #documentTemplate>
  <rts-print-document [layout]="layout()">
    <ng-template rtsPrintHeader>
      <div class="sale-print-branding">
        <strong>{{ organizationName() | nullSafe }}</strong>
        <span>{{ locationName() | nullSafe }}</span>
      </div>
    </ng-template>

    <rts-sale-print-content [sale]="sale()" [layout]="layout()" />

    <ng-template rtsPrintFooter>
      <p class="sale-print-thanks">Thank you for shopping with us.</p>
    </ng-template>
  </rts-print-document>
</ng-template>

<p-dialog header="Print preview"
          [(visible)]="previewVisible"
          [modal]="true"
          [draggable]="false"
          [style]="{width: 'min(96vw, 1000px)'}">
  <div class="flex flex-column gap-3">
    <div class="flex align-items-center gap-2">
      <label for="sale-print-layout">Paper</label>
      <p-select inputId="sale-print-layout"
                [options]="layouts"
                optionLabel="label"
                dataKey="id"
                [ngModel]="layout()"
                (onChange)="changeLayout($event.value)">
      </p-select>
    </div>

    @if (previewVisible()) {
      <rts-print-preview class="sale-print-preview" [zoom]="previewZoom()">
        <ng-container [ngTemplateOutlet]="documentTemplate" />
      </rts-print-preview>
    }

    <div class="flex justify-content-end gap-2">
      <button pButton type="button" severity="secondary" text (click)="previewVisible.set(false)">Close</button>
      <button pButton type="button" [disabled]="isPrinting()" (click)="printNow()">
        <i class="pi pi-print"></i> Print
      </button>
    </div>
  </div>
</p-dialog>
