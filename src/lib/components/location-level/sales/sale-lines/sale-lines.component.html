@if (canAddOrEditProducts()) {
  <rts-sale-product-lookup
    (productSelected)="sendLineRequest($event)"
    [templateRef]="saleProductLookup"
    [selectedProductIds]="selectedProductIds()">
  </rts-sale-product-lookup>

  <ng-template #saleProductLookup let-product>
    <div class="flex flex-column gap-1">
      {{ product | productLabel }}
      <small class="block fle gap-2 info-message">
        Available: {{ product.quantityAvailable }}

        @if (product.quantityReserved) {
          ({{product.quantityOnHand}} on hand, {{product.quantityReserved}} reserved)
        }
      </small>
    </div>
  </ng-template>
}

<div class="flex gap-3 mb-2">
  <span class="font-medium text-xl">Sale Lines</span>
  <p-badge [value]="saleLines().length" severity="info"/>
</div>

<rts-loading-container [loading]="unitConversionGraphIsLoading()" loadingText="Loading sale lines...">
  @if (canAddOrEditProducts()) {
    <rts-editable-sale-lines [saleLines]="saleLines()"/>
  } @else {
    <rts-read-only-sale-lines [saleLines]="saleLines()"/>
  }
</rts-loading-container>
