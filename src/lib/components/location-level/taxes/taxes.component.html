<rts-loading-container [loading]="loading()">
  <div class="flex" id="taxes-report" rtsAutoStretch="taxes-report">
    @if (selectedTab() === 'entries') {
      <rts-taxes-filter-readonly class="col-2" (editFilters)="selectedTab.set('summary')"/>
    } @else {
      <rts-taxes-filter class="col-3"/>
    }

    <p-divider layout="vertical"/>

    <div class="flex flex-column flex-grow-1">
      <p-tabs [value]="selectedTab()" (valueChange)="onSelectedTabChange($event)">
        <p-tablist>
          <p-tab value="summary">Summary</p-tab>
          <p-tab value="entries">
            Tax Entries
            <p-badge [value]="entryCount()" severity="info" class="ml-2"/>
          </p-tab>
        </p-tablist>

        <p-tabpanels>
          <p-tabpanel value="summary">
            <rts-taxes-summary/>
          </p-tabpanel>

          <p-tabpanel value="entries">
            <rts-tax-entries-grid/>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </div>
  </div>
</rts-loading-container>
