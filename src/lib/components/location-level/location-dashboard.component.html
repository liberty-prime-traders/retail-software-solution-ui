@if (saleFormVisibilityContext.formIsVisible()) {
  <rts-new-sale/>

} @else {
  <div class="flex gap-4 mr-3 h-full relative">
    @if (showNavigation()) {
      <div class="relative">
        <button pButton
                (click)="showNavigation.set(false)"
                size="small"
                severity="secondary"
                class="absolute position-right-5 position-top-3 z-1">
          <i class="pi pi-bars"></i>
        </button>
        <p-menu [model]="menuItems" class="block h-full filled-background"/>
      </div>

    } @else {
      <div class="pl-1">
        <button pButton severity="secondary" (click)="showNavigation.set(true)" size="small"><i class="pi pi-bars"></i></button>
      </div>
    }

    <p-card class="flex-grow-1">
      <router-outlet/>
    </p-card>

    @if (saleFormVisibilityContext.newSaleButtonIsVisible()) {
      <div id="saleButton" class="floating bottom right flex align-items-center gap-1">

        <button pButton
                cdkDrag
                cdkDragRootElement="#saleButton"
                size="small"
                rounded
                severity="success">
          <i class="pi pi-arrows-alt"></i>
        </button>

        <a id="sale-button"
           (click)="saleFormNavigator.openForNewSale()"
           class="flex gap-1 justify-content-between align-items-center cursor-pointer pulse green">
          <i class="pi pi-plus"></i>
          <span>New Sale</span>
        </a>
      </div>
    }
  </div>
}
