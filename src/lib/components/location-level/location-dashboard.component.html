@if (saleFormVisibilityContext.formIsVisible()) {
  <rts-new-sale/>

} @else {
  <div class="flex gap-4 mr-3 h-full relative">
    @if (showNavigation()) {
      <div class="relative">
        <p-button icon="pi pi-bars"
                  (onClick)="showNavigation.set(false)"
                  size="small"
                  severity="secondary"
                  class="absolute position-right-5 position-top-3 z-1">
        </p-button>
        <p-menu [model]="menuItems" class="block h-full filled-background"/>
      </div>

    } @else {
      <div class="pl-1">
        <p-button icon="pi pi-bars" severity="secondary" (onClick)="showNavigation.set(true)" size="small"/>
      </div>
    }

    <p-card class="flex-grow-1">
      <router-outlet/>
    </p-card>

    @if (saleFormVisibilityContext.newSaleButtonIsVisible()) {
      <a id="sale-button"
         (click)="saleFormVisibilityContext.showForm()"
         class="flex gap-1 justify-content-between align-items-center cursor-pointer floating bottom right">
        <i class="pi pi-plus"></i>
        <span>New Sale</span>
      </a>
    }
  </div>
}
