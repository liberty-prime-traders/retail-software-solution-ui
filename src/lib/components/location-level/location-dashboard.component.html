<div class="flex gap-4 block mr-3 h-full">
  @if (showNavigation()) {
    <p-menu [model]="menuItems" class="block h-full filled-background"/>
  }

  <div class="flex flex-grow-1 flex-column gap-2">
    <p-button icon="pi pi-bars" severity="secondary" (onClick)="showNavigation.set(!showNavigation())"></p-button>

    <p-card>
      <router-outlet/>
    </p-card>

  </div>
</div>
