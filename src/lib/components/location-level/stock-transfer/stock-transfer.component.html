<div id="stock-transfer" rtsAutoStretch="stock-transfer">
  <div class="flex align-items-center justify-content-between">
    <h3 class="font-bold">Stock Transfers</h3>
    @if (formIsVisible()) {
      <button pButton (click)="hideForm()" severity="secondary"><i class="pi pi-arrow-left"></i> Back to Stock Transfers</button>
    } @else {
      <button pButton (click)="startNewTransfer()"><i class="pi pi-plus"></i> New Transfer</button>
    }
  </div>

  @if (formIsVisible()) {
    <rts-location-stock-transfer-form/>
  } @else {
    <div class="pt-3">
      <rts-location-stock-transfer-grid/>
    </div>
  }

  <rts-error-summary class="floating bottom left" [regularErrorMessages]="failureMessages()"/>
</div>
