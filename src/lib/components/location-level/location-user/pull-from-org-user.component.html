<div class="flex flex-column gap-3">
  <div class="flex justify-content-between align-items-center">
    <h3 class="m-0">Add Users From Organization</h3>
    <p-button label="Cancel" icon="pi pi-times" severity="secondary" (onClick)="cancel.emit()"/>
  </div>

  <p-multiSelect
    [options]="availableOrgUsers()"
    [filter]="false"
    optionLabel="fullName"
    optionValue="userId"
    [loading]="orgUsersLoading()"
    emptyFilterMessage="No users available"
    display="chip"
    class="w-full"
    [(ngModel)]="selectedUserIds">
  </p-multiSelect>

  <div class="flex justify-content-end">
    <p-button
      label="Add Selected Users"
      icon="pi pi-download"
      [loading]="pulling()"
      [disabled]="pulling() || selectedUserIds().length === 0"
      (onClick)="pullSelectedUsers()">
    </p-button>
  </div>
</div>
