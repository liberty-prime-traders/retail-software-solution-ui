<div class="flex flex-column gap-3">
  <div class="flex justify-content-between align-items-center">
    <h3 class="m-0">Add Users From Organization</h3>
    <button pButton severity="secondary" (click)="cancel.emit()">
      <i class="pi pi-times"></i>
      Cancel
    </button>
  </div>

  <p-select
    [options]="availableOrgUsers()"
    [filter]="false"
    optionLabel="fullName"
    optionValue="userId"
    [multiple]="true"
    [loading]="orgUsersLoading()"
    emptyFilterMessage="No users available"
    class="w-full"
    [(ngModel)]="selectedUserIds">
  </p-select>

  <div class="flex justify-content-end">
    <button pButton
            [disabled]="pulling() || selectedUserIds().length === 0"
            (click)="pullSelectedUsers()">
      <i class="pi pi-download"></i> Add Selected Users
    </button>
  </div>
</div>
