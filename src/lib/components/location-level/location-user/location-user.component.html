@if (showPullFromOrgScreen()) {
  <rts-pull-from-org-user
    (cancel)="hidePullFromOrgScreen()"
    (pulled)="hidePullFromOrgScreen()">
  </rts-pull-from-org-user>

} @else {
  <rts-user-management [schemaLevel]="SchemaLevel.LOCATION">
    <button pButton
            severity="secondary"
            (click)="openPullFromOrgScreen()">
      <i class="pi pi-user-plus"></i> Add Users
    </button>
  </rts-user-management>
}
