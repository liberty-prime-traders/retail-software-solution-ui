<div class="flex flex-column gap-3">
  <rts-form-field label="Search Products">
    <p-auto-complete (completeMethod)="searchTerm$.next($event.query)"
                     inputStyleClass="w-full"
                     optionLabel="label"
                     optionValue="value"
                     dataKey="value"
                     #autoComplete
                     [showClear]="true"
                     (onSelect)="addPurchaseLine($event.value); autoComplete.clear()"
                     [suggestions]="productOptions()">
    </p-auto-complete>
  </rts-form-field>

  <p-table [value]="purchaseLinesArray()"
           [editingRowKeys]="editingRowKeys()"
           dataKey="locationProductId"
           editMode="row"
           size="small">
    <ng-template pTemplate="header">
      <tr>
        <th>Product</th>
        <th>Units</th>
        <th>Quantity</th>
        <th>Unit Price</th>
        <th>Total</th>
        <th style="width: 100px"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-purchaseLine let-editing="editing">
      <tr [pEditableRow]="purchaseLine">
        <td>{{ purchaseLine | productLabel }}</td>
        <td>{{ purchaseLine.baseUnit }}</td>

        <td>
          <p-cellEditor>
            <ng-template pTemplate="input">
              <p-inputNumber [min]="0" [(ngModel)]="purchaseLine.quantityOrdered" />
            </ng-template>
            <ng-template pTemplate="output">
              {{ purchaseLine.quantityOrdered }}
            </ng-template>
          </p-cellEditor>
        </td>

        <td>
          <p-cellEditor>
            <ng-template pTemplate="input">
              <p-inputNumber [min]="0" [(ngModel)]="purchaseLine.unitCost" />
            </ng-template>
            <ng-template pTemplate="output">
              {{ purchaseLine.unitCost | currency  }}
            </ng-template>
          </p-cellEditor>
        </td>

        <td>{{ purchaseLine.totalCost | currency }}</td>

        <td>
          <div class="flex gap-1">
            @if (editing) {
              <p-button icon="pi pi-check"
                        text
                        rounded
                        pSaveEditableRow
                        (keydown.enter)="completeEditingLine(purchaseLine)"
                        (onClick)="completeEditingLine(purchaseLine)">
              </p-button>

              <p-button icon="pi pi-times"
                        text
                        rounded
                        pCancelEditableRow
                        (keydown.enter)="cancelEditingLine(purchaseLine)"
                        (onClick)="cancelEditingLine(purchaseLine)">
              </p-button>

            } @else {
              <p-button icon="pi pi-pencil"
                        text
                        rounded
                        pInitEditableRow
                        (keydown.enter)="initEditingLine(purchaseLine)"
                        (onClick)="initEditingLine(purchaseLine)">
              </p-button>
            }
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
