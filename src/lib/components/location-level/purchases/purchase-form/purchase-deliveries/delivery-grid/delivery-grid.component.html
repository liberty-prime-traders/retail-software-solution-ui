@if (showNewDeliveryForm()) {
  <rts-purchase-delivery-form (deliverySaved)="showNewDeliveryForm.set(false)"
                              (cancelled)="showNewDeliveryForm.set(false)">
  </rts-purchase-delivery-form>

} @else {
  <div class="flex flex-column gap-3">

    @if (canAddDeliveries()) {
      <div class="flex justify-content-end">
        <p-button label="Record Delivery"
                  icon="pi pi-plus"
                  (click)="showNewDeliveryForm.set(true)">
        </p-button>
      </div>
    }

    <p-table [value]="deliveries()"
             dataKey="id"
             sortField="referenceNumber"
             [expandedRowKeys]="expandedRowKeys()"
             (onRowExpand)="onRowExpand($event)"
             (onRowCollapse)="onRowCollapse($event)">

      <ng-template pTemplate="header">
        <tr>
          <th style="width: 3rem"></th>
          <th>Reference Number</th>
          <th>Delivered At</th>
          <th>Delivery Total</th>
          <th>Notes</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-delivery let-expanded="expanded">
        <tr [ngClass]="{'expanded-row': expanded}">
          <td>
            <p-button type="button"
                      text
                      rounded
                      [pRowToggler]="delivery"
                      [icon]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'">
            </p-button>
          </td>
          <td>{{ delivery.referenceNumber }}</td>
          <td>{{ delivery.deliveredAt | date: 'medium' }}</td>
          <td>{{ delivery.deliveryTotal | currency }}</td>
          <td>{{ delivery.notes }}</td>
        </tr>
      </ng-template>

      <ng-template pTemplate="expandedrow" let-delivery>
        <tr>
          <td colspan="6" class="filled-background p-4">
            <rts-delivery-subgrid [delivery]="delivery"/>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr [colspan]="6" rts-empty-row message="No deliveries recorded yet"></tr>
      </ng-template>

    </p-table>
  </div>
}
