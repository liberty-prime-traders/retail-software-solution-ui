<rts-loading-container [loading]="purchaseIsLoading()" loadingText="Saving...">
  <form class="flex flex-column" id="purchaseForm" rtsAutoStretch="purchaseForm" [useMinHeight]="true" [padding]="20">

    <rts-purchase-form-general-fields/>

    <p-tabs value="items">
      <p-tablist>
        <p-tab value="items">Items</p-tab>

        @if (!isDraftOrNew()) {
          <p-tab value="deliveries">Deliveries</p-tab>
          <p-tab value="payments">Payments</p-tab>
          <p-tab value="returns">Returns</p-tab>
        }
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="items">
          <rts-purchase-lines/>
        </p-tabpanel>

        @if (!isDraftOrNew()) {
          <p-tabpanel value="deliveries">
            <rts-purchase-deliveries/>
          </p-tabpanel>

          <p-tabpanel value="payments">
            <rts-supplier-payment-grid [purchaseId]="purchaseId()"
                                       [canAddPayment]="canAddPayments()"
                                       (paymentChanged)="reloadFormFromStore()">
            </rts-supplier-payment-grid>
          </p-tabpanel>
        }
      </p-tabpanels>
    </p-tabs>

    <div style="height: 100px"></div>
  </form>

  @if (isDraftOrNew()) {
    <div class="floating bottom right flex gap-2">
      <button pButton
              severity="secondary"
              (click)="resetForm()"
              [disabled]="!purchaseForm().dirty()">
        <i class="pi pi-times"></i> Reset
      </button>

      <button pButton
              severity="secondary"
              (click)="placeOrder()"
              [disabled]="purchaseForm().invalid() || !canPlaceOrder() || isEditingLines()">
        <i class="pi pi-send"></i> Place Order
      </button>

      <button pButton
              (click)="saveDraft()"
              [disabled]="purchaseForm().invalid() || isEditingLines()">
        <i class="pi pi-save"></i> Save Draft
      </button>
    </div>
    }
</rts-loading-container>
