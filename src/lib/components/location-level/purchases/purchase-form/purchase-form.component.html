<rts-loading-container [loading]="purchaseIsLoading()" loadingText="Saving...">
  <form class="flex flex-column" id="purchaseForm" rtsAutoStretch="purchaseForm">

    <rts-purchase-form-general-fields/>

    <p-tabs value="items">
      <p-tablist>
        <p-tab value="items">Items</p-tab>
        @if (!isCreating()) {
          <p-tab value="deliveries">Deliveries</p-tab>
          <p-tab value="payments">Payments</p-tab>
        }

      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="items">
          <rts-purchase-lines/>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>

    <div style="height: 400px"></div>
  </form>

  <div class="floating flex gap-2">
    <p-button label="Reset"
              icon="pi pi-times"
              severity="secondary"
              (click)="resetForm()"
              [disabled]="!purchaseForm().dirty()">
    </p-button>

    <p-button [label]="(isCreating() ? 'Create' : 'Update') + ' Draft'"
              icon="pi pi-check"
              severity="primary"
              (click)="saveDraft()"
              [disabled]="purchaseForm().invalid()">
    </p-button>
  </div>
</rts-loading-container>
