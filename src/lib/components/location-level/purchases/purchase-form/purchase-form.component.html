<rts-loading-container [loading]="isLoading()" loadingText="Saving...">
  <p-divider/>

  <form class="flex flex-column" id="purchaseForm" rtsAutoStretch="purchaseForm">

    <rts-purchase-form-general-fields/>

    <p-tabs value="items">
      <p-tablist>
        <p-tab value="items">Items</p-tab>

        @if (!isDraftOrNew()) {
          <p-tab value="deliveries">Deliveries</p-tab>
          <p-tab value="payments">Payments</p-tab>
          <p-tab value="expenses">Expenses</p-tab>
        }
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="items">
          <rts-purchase-lines/>
        </p-tabpanel>

        @if (!isDraftOrNew()) {
          <p-tabpanel value="deliveries">
            <rts-purchase-deliveries/>
          </p-tabpanel>

          <p-tabpanel value="payments">
            <rts-supplier-payment-grid [purchaseId]="purchaseId()"
                                       [canAddPayment]="canAddPayments()"
                                       (paymentChanged)="reloadFormFromStore()">
            </rts-supplier-payment-grid>
          </p-tabpanel>

          <p-tabpanel value="expenses">
            <rts-contextual-expense-grid
              [sourceReference]="purchaseReference()"
              [defaultPayeeContactId]="supplierId()"
              [sourceType]="ExpenseSourceType.PURCHASE"
              [canAddExpense]="true">
            </rts-contextual-expense-grid>
          </p-tabpanel>
        }
      </p-tabpanels>
    </p-tabs>

    <div style="height: 100px"></div>
  </form>
</rts-loading-container>
