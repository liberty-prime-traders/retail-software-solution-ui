<div id="purchase-grid" rtsAutoStretch="purchase-grid">
  <p-table [value]="purchases()"
           [loading]="loading()"
           sortField="referenceNumber"
           [sortOrder]="-1"
           scrollHeight="flex"
           dataKey="id">

    <ng-template pTemplate="header">
      <tr>
        <th>Reference</th>
        <th>Supplier</th>
        <th>Status</th>
        <th>Date Ordered</th>
        <th>Ordered By</th>
        <th>Total</th>
        <th>Payment Status</th>
        <th style="width: 5rem"></th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-purchase>
      <tr>
        <td>{{ purchase.referenceNumber | nullSafe }}</td>
        <td>{{ purchase.supplierName | nullSafe }}</td>
        <td>
          <p-tag [value]="purchase.purchaseStatus | prettifyEnum"
                 [severity]="purchase.purchaseStatus | purchaseStatusSeverity">
          </p-tag>
        </td>
        <td>{{ purchase.dateOrdered | date: 'mediumDate' | nullSafe }}</td>
        <td>{{ purchase.orderedBy | nullSafe }}</td>
        <td>{{ purchase.orderTotal | currency }}</td>
        <td>
          <p-tag [value]="purchase.paymentStatus | prettifyEnum"
                 [severity]="purchase.paymentStatus | paymentStatusSeverity">
          </p-tag>
        </td>
        <td>
          <p-button icon="pi pi-pen-to-square"
                    rounded
                    severity="secondary"
                    [disabled]="loading()"
                    (onClick)="onEditPurchase(purchase)">
          </p-button>
        </td>
      </tr>
    </ng-template>

  </p-table>

</div>
