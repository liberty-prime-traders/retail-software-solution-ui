<div class="flex align-items-center justify-content-between">
  <h3 class="font-bold">Purchases</h3>
  @if (formIsVisible()) {
    <button pButton (click)="hideForm()" severity="secondary"><i class="pi pi-arrow-left"></i> Back to Purchases</button>
  } @else {
    <button pButton (click)="startNewPurchase()"><i class="pi pi-plus"></i> New Purchase</button>
  }
</div>

@if (formIsVisible()) {
  <rts-purchase-form/>
} @else {
  <rts-loading-container [loading]="loading()">
    <div class="flex pt-3" id="purchases-report" rtsAutoStretch="purchases-report">
      @if (selectedTab() === 'purchases') {
        <rts-purchases-filter-readonly class="col-2" (editFilters)="selectedTab.set('summary')"/>
      } @else {
        <rts-purchases-filter class="col-3"/>
      }

      <p-divider layout="vertical"/>

      <div class="flex flex-column flex-grow-1">
        <p-tabs [(value)]="selectedTab">
          <p-tablist>
            <p-tab value="summary">Summary</p-tab>
            <p-tab value="purchases">
              Purchases
              <p-badge [value]="purchaseCount()" severity="info" class="ml-2"/>
            </p-tab>
          </p-tablist>

          <p-tabpanels>
            <p-tabpanel value="summary">
              <rts-purchases-summary/>
            </p-tabpanel>

            <p-tabpanel value="purchases">
              <rts-purchase-grid/>
            </p-tabpanel>
          </p-tabpanels>
        </p-tabs>
      </div>
    </div>
  </rts-loading-container>
}
