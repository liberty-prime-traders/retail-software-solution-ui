<div class="flex flex-column gap-5">
  <div>
    <h3 class="font-semibold">Payment Options</h3>
    <hr/>

    <p-table [loading]="loading() && !addingIsActive()"
             rowExpandMode="single"
             size="small"
             dataKey="id"
             sortField="name"
             (onRowExpand)="rowIsExpanded.set(true)"
             (onRowCollapse)="rowIsExpanded.set(false)"
             [value]="paymentOptions()">

      <ng-template #header>
        <tr class="line-height-4">
          <th pSortableColumn="name">
            Name
            <p-sortIcon field="name"/>
          </th>
          <th pSortableColumn="description">
            Description
            <p-sortIcon field="description"/>
          </th>
          <th pSortableColumn="createdBy">
            Created By
            <p-sortIcon field="createdBy"/>
          </th>
          <th pSortableColumn="usageCount">
            Usage Count
            <p-sortIcon field="usageCount"/>
          </th>
          <th style="width: 5rem"></th>
        </tr>

        <tr>
          <th>
            <p-columnFilter field="name" type="text" matchMode="contains" placeholder="Search by name"/>
          </th>
          <th>
            <p-columnFilter field="description" type="text" matchMode="contains" placeholder="Search by description"/>
          </th>
          <th>
            <p-columnFilter field="createdBy" type="text" matchMode="contains" placeholder="Search by created by"/>
          </th>
          <th></th>
          <th></th>
        </tr>

      </ng-template>

      <ng-template #body let-paymentOption let-expanded="expanded">
        <tr>
          <td>{{paymentOption?.name | nullSafe}}</td>
          <td>{{paymentOption?.description | nullSafe}}</td>
          <td>{{paymentOption?.createdBy | nullSafe}}</td>
          <td>{{paymentOption?.usageCount | nullishToZero}}</td>
          <td>
            <p-button [icon]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"
                      rounded
                      severity="secondary"
                      [disabled]="processingIsUnderWay() || addingIsActive()"
                      [pRowToggler]="paymentOption">
            </p-button>
          </td>
        </tr>
      </ng-template>

      <ng-template #expandedrow let-paymentOption>
        <tr>
          <td colspan="5" class="filled-background">
            <rts-payment-option-form [paymentOption]="paymentOption" />
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="5" class="filled-background h-4rem">No Payment Options Were Found</td>
        </tr>
      </ng-template>
    </p-table>

    <rts-add-row [(addingIsActive)]="addingIsActive" [disabled]="rowIsExpanded() || loading()">
      @if (addingIsActive()) {
        <rts-payment-option-form></rts-payment-option-form>
      }
    </rts-add-row>
  </div>
</div>
