<p-table [value]="payments()" dataKey="reference">
  <ng-template #header>
    <tr>
      <th>Payment Method</th>
      <th>Amount</th>
      <th>Reference</th>
      <th>Payment Date</th>
      <th>Voided Reason</th>
    </tr>
  </ng-template>

  <ng-template #body let-payment>
    <tr [ngClass]="{'strike-through': payment.voided}">
      <td>{{ payment.paymentMethodName }}</td>
      <td>{{ payment.amount | currency }}</td>
      <td>{{ payment.providerReference | nullSafe }}</td>
      <td>{{ payment.paymentDate }}</td>
      <td>{{ payment.voidReason | nullSafe }}</td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr [colspan]="5" rts-empty-row message="No payments recorded yet"></tr>
  </ng-template>
</p-table>
