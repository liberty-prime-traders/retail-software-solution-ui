<div class="flex flex-column">
  @if (isVoided()) {
    <div>
      <span class="font-semibold error-message">Voided reason: </span>
      <span>{{ payment().voidReason }}</span>
    </div>
  } @else {
    <button pButton
            [text]="true"
            severity="warn"
            class="w-fit"
            (click)="voidIsActive.set(true)"
            [disabled]="voidIsActive()">
      Was this payment recorded by mistake?
    </button>

    @if (voidIsActive()) {
      <rts-form-field label="Void Reason"
                      [required]="true"
                      [layout]="FormFieldDirection.VERTICAL"
                      class="col-5"
                      contentClass="col-12">
        <textarea pInputText class="w-full" rows="3" [formField]="voidForm.reason"></textarea>
      </rts-form-field>

      <rts-forms-buttons deleteLabel="Void Payment"
                         deleteWarning="This action cannot be undone."
                         deleteInProgressMessage="Voiding payment..."
                         deleteIcon="pi pi-ban"
                         resetLabel="Cancel"
                         [hideSave]="true"
                         [disableDelete]="voidForm().invalid()"
                         [processingStatus]="processingStatus()"
                         [failureMessages]="failureMessages()"
                         (resetAction)="voidIsActive.set(false)"
                         (delete)="confirmVoid()">
      </rts-forms-buttons>
    }
  }
</div>
