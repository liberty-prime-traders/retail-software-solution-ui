<p-card>
  <div class="flex flex-column gap-2" style="min-width: 10rem">
    <span class="text-color-secondary">{{ label() }}</span>
    @if (loading()) {
      <p-skeleton width="8rem" height="2rem" />
      <p-skeleton width="6rem" height="1rem" />
    } @else {
      <span class="font-bold tabular-nums" [ngClass]="amountClass()">
        @if (toneIconClass()) {
          <i [class]="toneIconClass()" aria-hidden="true"></i>
        }
        {{ amount() | currency }}
      </span>
      @if (change() !== null) {
        <rts-amount-change [amount]="change()!" [suffix]="changeSuffix()" [nonZeroSignal]="changeSignal()" />
      } @else if (subLabel()) {
        <span class="text-color-secondary">{{ subLabel() }}</span>
      }
      @if (caption()) {
        <span class="text-sm text-color-secondary">{{ caption() }}</span>
      }
    }
  </div>
</p-card>
