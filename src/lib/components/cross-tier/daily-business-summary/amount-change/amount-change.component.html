<span class="amount-change inline-flex white-space-nowrap align-items-center gap-1 tabular-nums">
  <i [class]="iconClass()" aria-hidden="true"></i>
  <span>{{ sign() }}</span>
  <rts-money [amount]="amount()" [balanceEffect]="changeEffect()" />
  @if (suffix()) {
    <span class="text-color-secondary">{{ suffix() }}</span>
  }
</span>
