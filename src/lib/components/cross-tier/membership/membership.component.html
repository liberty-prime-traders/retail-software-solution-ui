<p-table [loading]="loading()"
         dataKey="userId"
         rowExpandMode="single"
         sortField="fullName"
         #userTable
         scrollHeight="flex"
         [scrollable]="true"
         [value]="users()"
         [globalFilterFields]="['fullName', 'email']"
         [(selection)]="selectedUsers">

  <ng-template #caption>
    <div class="flex justify-content-between align-items-center">
      <h3>{{ title() }}</h3>

      <div class="flex justify-content-end gap-6 mb-3 align-items-center">
        <button pButton
                variant="text"
                severity="danger"
                [disabled]="loading() || selectedUsers().length === 0"
                (click)="terminateSelectedUsers()">
          <i class="pi pi-user-minus"></i> Terminate Selected Users
        </button>

        <rts-grid-filter [dataTable]="userTable" margin="m-0"/>

        <ng-content/>
      </div>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th style="width: 4rem"></th>
      <th pSortableColumn="fullName">Name
        <p-sort-icon field="fullName"></p-sort-icon>
      </th>
      <th pSortableColumn="email">Email
        <p-sort-icon field="email"></p-sort-icon>
      </th>
      <th pSortableColumn="active">Active
        <p-sort-icon field="active"></p-sort-icon>
      </th>
      <th style="width: 4rem"></th>
    </tr>
  </ng-template>

  <ng-template #body let-user let-expanded="expanded">
    @let userIsActive = user.active;

    <tr [pSelectableRow]="user"
        [ngClass]="{'inactive font-light' : !userIsActive, 'expanded-row': expanded}">
      <td>
        @if (userIsActive) {
          <p-table-checkbox [value]="user"/>
        }
      </td>
      <td>
        {{ user.fullName | nullSafe }}
      </td>
      <td>{{ user.email }}</td>
      <td>
        <p-tag [value]="userIsActive ? 'Active' : 'Inactive'"
               [severity]="userIsActive ? 'success' : 'danger'"
               [rounded]="true">
        </p-tag>
      </td>
      <td>
        <button pButton
                rounded
                severity="secondary"
                [pRowToggler]="user">
          <i [class]="expanded ? 'pi pi-times' : 'pi pi-angle-left'"></i>
        </button>
      </td>
    </tr>
  </ng-template>

  <ng-template #expandedrow let-user>
    <tr>
      <td colspan="5" class="filled-background">
        <rts-user-access-detail [userId]="user.userId" [schemaLevel]="schemaLevel()"/>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr rts-empty-row [colspan]="5" message="No users found"></tr>
  </ng-template>
</p-table>
