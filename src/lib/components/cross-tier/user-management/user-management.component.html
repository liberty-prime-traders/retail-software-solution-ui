<div id="user-management" rtsAutoStretch="user-management">
  @if (showAuthorityAssignmentScreen()) {
    <rts-authority-assignment
      [schemaLevel]="schemaLevel()"
      (cancel)="hideAuthorityAssignment()"
      (assign)="onAuthoritiesAssigned($event)">
    </rts-authority-assignment>
  } @else {
    <rts-membership [schemaLevel]="schemaLevel()">
      <div class="flex align-items-center gap-2 mb-3">
        <ng-content/>

        <button pButton
                (click)="openAuthorityAssignment()">
          <i class="pi pi-plus"></i> Assign Authority
        </button>
      </div>
    </rts-membership>
  }
</div>
