<p-table  [loading]="loading() && !addingIsActive()"
          selectionMode="single"
          rowExpandMode="single"
          dataKey="id"
          scrollHeight="600px"
          [scrollable]="true"
          #jobTitlesTable
          [value]="jobTitles()"
          [(selection)]="selectedJobTitle"
          [globalFilterFields]="['value', 'createdBy']"
          (onRowExpand)="rowIsExpanded.set(true)"
          (onRowCollapse)="rowIsExpanded.set(false)">

  <ng-template #caption>
    <div class="flex justify-content-between align-items-center">
      <h3>Job Titles</h3>
      <rts-grid-filter [dataTable]="jobTitlesTable"/>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="value">
        Value
        <p-sort-icon field="value"></p-sort-icon>
      </th>
      <th pSortableColumn="createdBy">
        Created By
        <p-sort-icon field="createdBy"></p-sort-icon>
      </th>
      <th pSortableColumn="usageCount">
        Usage Count
        <p-sort-icon field="usageCount"></p-sort-icon>
      </th>
      <th style="width: 5rem"></th>
    </tr>
  </ng-template>

  <ng-template #body let-jobTitle let-expanded="expanded">
    <tr [ngClass]="{ 'expanded-row': expanded }">
      <td>{{ jobTitle?.value | nullSafe }}</td>
      <td>{{ jobTitle?.createdBy | nullSafe }}</td>
      <td>{{ jobTitle?.usageCount | nullSafe }}</td>
      <td>
        <button pButton
                rounded
                severity="secondary"
                [disabled]="loading() || addingIsActive()"
                [pRowToggler]="jobTitle">
          <i [class]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"></i>
        </button>
      </td>
    </tr>
  </ng-template>

  <ng-template #expandedrow let-jobTitle>
    <tr>
      <td colspan="5" class="filled-background">
        <rts-job-title-form [jobTitle]="jobTitle" />
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr rts-empty-row [colspan]="5" message="No Job Titles Were Found"></tr>
  </ng-template>
</p-table>

<rts-add-row [(addingIsActive)]="addingIsActive" [disabled]="rowIsExpanded() || loading()">
  @if (addingIsActive()) {
    <rts-job-title-form/>
  }
</rts-add-row>
