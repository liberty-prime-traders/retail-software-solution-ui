<p-card>
  <h3>Organization Profile</h3>

  <p-divider/>

  <form class="mt-2">
    <rts-form-field for="name" label="Name" [required]="true" contentClass="col-8">
      <input id="name" pInputText [formField]="organizationForm.name"/>
    </rts-form-field>

    <rts-form-field for="description" label="Description" contentClass="col-8">
      <textarea id="description" pInputText [formField]="organizationForm.description" class="w-full"></textarea>
    </rts-form-field>

    <div class="flex justify-content-end col-6 p-0">
      <rts-forms-buttons
          [disableReset]="!organizationForm().dirty()"
          [disableSave]="organizationForm().invalid() || !organizationForm().dirty()"
          [hideReset]="true"
          [hideDelete]="true"
          [signalForm]="organizationForm()"
          [fieldMap]="organizationFieldMap"
          [processingStatus]="organizationProcessingStatus()"
          [failureMessages]="organizationServiceFailureMessages()"
          [saveLabel]="'Update'"
          (save)="updateOrganization()"
          (resetAction)="resetForm()">
      </rts-forms-buttons>
    </div>
  </form>

</p-card>
