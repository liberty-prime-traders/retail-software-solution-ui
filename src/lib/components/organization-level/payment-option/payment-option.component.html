<div class="flex flex-column gap-4" id="payment-options" rtsAutoStretch="payment-options">
  @if (addingIsActive()) {
    <rts-new-form-cancel-button (onCancel)="setAddingActiveFalse()"/>
    <rts-payment-option-form (paymentOptionCreated)="closeAddRow()"/>

  } @else {
    <p-table [loading]="loading() && !addingIsActive()"
             rowExpandMode="single"
             dataKey="id"
             sortField="name"
             #paymentOptionsTable
             scrollHeight="flex"
             [scrollable]="true"
             [globalFilterFields]="['name', 'description', 'createdBy']"
             (onRowExpand)="rowIsExpanded.set(true)"
             (onRowCollapse)="rowIsExpanded.set(false)"
             [value]="paymentOptions()">

      <ng-template #caption>
        <div class="flex justify-content-between align-items-center">
          <h3>Payment Options</h3>

          <rts-grid-filter [dataTable]="paymentOptionsTable"/>

          <button pButton (click)="setAddingActiveTrue()"
                  [disabled]="loading() || addingIsActive()"
                  rounded
                  severity="secondary">
            + Add Payment Option
          </button>
        </div>
      </ng-template>

      <ng-template #header>
        <tr class="line-height-4">
          <th pSortableColumn="name">
            Name
            <p-sort-icon field="name"/>
          </th>
          <th pSortableColumn="description">
            Description
            <p-sort-icon field="description"/>
          </th>
          <th pSortableColumn="createdBy">
            Created By
            <p-sort-icon field="createdBy"/>
          </th>
          <th>Linked Account</th>
          <th style="width: 5rem"></th>
        </tr>
      </ng-template>

      <ng-template #body let-paymentOption let-expanded="expanded">
        <tr [ngClass]="{ 'expanded-row': expanded }">
          <td>{{paymentOption?.name | nullSafe}}</td>
          <td>{{paymentOption?.description | nullSafe}}</td>
          <td>{{paymentOption?.createdBy | nullSafe}}</td>
          <td>{{paymentOption?.linkedAccount | nullSafe}}</td>
          <td>
            <button pButton
                    rounded
                    severity="secondary"
                    [disabled]="loading() || addingIsActive()"
                    [pRowToggler]="paymentOption">
              <i [class]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"></i>
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template #expandedrow let-paymentOption>
        <tr>
          <td colspan="5" class="filled-background">
            <rts-payment-option-form [paymentOption]="paymentOption"/>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr rts-empty-row [colspan]="5" message="No Payment Options Were Found"></tr>
      </ng-template>
    </p-table>
  }
</div>
