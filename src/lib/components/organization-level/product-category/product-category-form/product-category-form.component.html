<form class="flex flex-column gap-2" [ngClass]="productCategory()?.id ? '' : 'filled-background'">
  <rts-form-field [required]="true" label="Product Category Name" for="categoryName">
    <input id="categoryName" class="flex-grow-1" pInputText [formField]="productCategoryForm.categoryName">
  </rts-form-field>

  <rts-form-field label="Description" for="description">
    <input id="description" pInputText [formField]="productCategoryForm.description">
  </rts-form-field>

  <rts-forms-buttons
      [disableReset]="!productCategoryForm().dirty()"
      [disableSave]="productCategoryForm().invalid() || !productCategoryForm().dirty()"
      [hideDelete]="!productCategory()?.id"
      [signalForm]="productCategoryForm()"
      [fieldMap]="productCategoryFieldMap"
      [processingStatus]="processingStatus()"
      [failureMessages]="failureMessages()"
      (delete)="deleteProductCategory()"
      (save)="upsertProductCategory()"
      (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
