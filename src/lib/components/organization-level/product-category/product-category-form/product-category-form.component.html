<form [formGroup]="productCategoryForm()" class="flex flex-column gap-2" [ngClass]="productCategory()?.id ? '' : 'filled-background'">
  <rts-form-field [required]="true" label="Product Category Name" for="categoryName">
    <input id="categoryName" class="flex-grow-1" pInputText formControlName="categoryName">
  </rts-form-field>

  <rts-form-field label="Description" for="description">
    <input id="description" pInputText formControlName="description">
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!productCategoryForm().dirty"
                     [disableSave]="!productCategoryForm().valid || !productCategoryForm().dirty"
                     [hideDelete]="!productCategory()?.id"
                     [processingStatus]="processingStatus()"
                     [failureMessages]="failureMessages()"
                     (delete)="deleteProductCategory()"
                     (save)="upsertProductCategory()"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
