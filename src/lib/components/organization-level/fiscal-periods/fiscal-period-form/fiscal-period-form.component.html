<form class="flex flex-column gap-2">
  <rts-form-field [required]="true" label="Name" for="name">
    <input id="name" class="flex-grow-1" pInputText [formField]="periodForm.name"/>
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!periodForm().dirty()"
                     [disableSave]="periodForm().invalid() || !periodForm().dirty()"
                     [hideDelete]="true"
                     [signalForm]="periodForm()"
                     [fieldMap]="fieldMap"
                     [processingStatus]="processingStatus()"
                     [failureMessages]="failureMessages()"
                     (save)="save()"
                     class="flex-grow-1"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
