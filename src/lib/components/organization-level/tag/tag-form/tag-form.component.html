<form class="flex flex-column gap-2" [ngClass]="tag()?.id ? '' : 'filled-background'">
  <rts-form-field [required]="true" label="Tag Name" for="tagName">
    <input id="tagName" class="flex-grow-1" pInputText [formField]="tagForm.tagName">
  </rts-form-field>

  <rts-form-field label="Category" for="category" [required]="true">
    <p-select id="category"
              class="flex-grow-1"
              [formField]="tagForm.category"
              [options]="categoryType | enumToDropdown">
    </p-select>
  </rts-form-field>

  <rts-form-field label="Description" for="description">
    <input id="description" pInputText [formField]="tagForm.description">
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!tagForm().dirty()"
                     [disableSave]="tagForm().invalid() || !tagForm().dirty()"
                     [hideDelete]="!tag()?.id"
                     [signalForm]="tagForm()"
                     [fieldMap]="tagFieldMap"
                     [processingStatus]="processingStatus()"
                     [failureMessages]="failureMessages()"
                     (delete)="deleteTag()"
                     (save)="upsertTag()"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
