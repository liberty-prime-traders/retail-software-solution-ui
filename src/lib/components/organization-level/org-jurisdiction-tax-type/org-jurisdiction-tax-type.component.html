<div class="flex flex-column gap-4" id="org-jurisdiction-tax-types" rtsAutoStretch="org-jurisdiction-tax-types">
  @if (addingIsActive()) {
    <rts-new-form-cancel-button (onCancel)="setAddingActiveFalse()"/>
    <rts-org-jurisdiction-tax-type-add-form (allSaved)="closeAddRow()"/>

  } @else {
    <p-table [loading]="loading() && !addingIsActive()"
             rowExpandMode="single"
             dataKey="id"
             scrollHeight="flex"
             [scrollable]="true"
             sortField="jurisdictionTaxType"
             #orgJurisdictionTaxTypesTable
             [globalFilterFields]="['jurisdictionTaxType']"
             (onRowExpand)="rowIsExpanded.set(true)"
             (onRowCollapse)="rowIsExpanded.set(false)"
             [value]="entities()">

      <ng-template pTemplate="caption">
        <div class="flex justify-content-between align-items-center">
          <h3 class="font-bold">Tax Types</h3>

          <rts-grid-filter [dataTable]="orgJurisdictionTaxTypesTable"/>

          <p-button (click)="setAddingActiveTrue()"
                    [disabled]="loading() || addingIsActive()"
                    label="+ Add Tax Types"
                    rounded
                    severity="secondary">
          </p-button>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="jurisdictionTaxType">
            Tax Type
            <p-sortIcon field="jurisdictionTaxType"/>
          </th>
          <th pSortableColumn="startDate">
            Start Date
            <p-sortIcon field="startDate"/>
          </th>
          <th pSortableColumn="endDate">
            End Date
            <p-sortIcon field="endDate"/>
          </th>
          <th style="width: 5rem"></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-entity let-expanded="expanded">
        <tr [ngClass]="{ 'expanded-row': expanded }">
          <td>{{ entity?.jurisdictionTaxType | nullSafe }}</td>
          <td>{{ entity?.startDate | nullSafe }}</td>
          <td>{{ entity?.endDate | nullSafe }}</td>
          <td>
            <p-button [icon]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"
                      rounded
                      severity="secondary"
                      [disabled]="loading() || addingIsActive()"
                      [pRowToggler]="entity">
            </p-button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="expandedrow" let-entity>
        <tr>
          <td colspan="4" class="filled-background">
            <rts-org-jurisdiction-tax-type-edit-form [orgJurisdictionTaxType]="entity"/>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr rts-empty-row [colspan]="4" message="No Jurisdiction Tax Types Were Found"></tr>
      </ng-template>
    </p-table>
  }
</div>
