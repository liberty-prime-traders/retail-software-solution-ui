<rts-loading-container [loading]="loading()">
  <div class="p-2 flex flex-column gap-4">
    <p-message severity="warn" icon="pi pi-exclamation-triangle">
      <ul>
        <li>Changes may take a few seconds to reflect across the system</li>
        <li>The provided value overwrites the current opening balance</li>
        <li>All changes to the opening balance are tracked and displayed under update history</li>
      </ul>
    </p-message>

    <rts-form-field [required]="true" label="We owed them" for="payable" [layout]="FormFieldLayout.VERTICAL">
      <p-input-number id="payable"
                      mode="currency"
                      placeholder="e.g. 15.00"
                      [maxFractionDigits]="2"
                      [min]="0"
                      [currency]="currencyCodeProviderService.currencyCode"
                      [formField]="openingBalanceForm.payable">
      </p-input-number>
    </rts-form-field>

    <rts-form-field [required]="true" label="They owed us" for="receivable" [layout]="FormFieldLayout.VERTICAL">
      <p-input-number id="receivable"
                      mode="currency"
                      placeholder="e.g. 15.00"
                      [maxFractionDigits]="2"
                      [min]="0"
                      [currency]="currencyCodeProviderService.currencyCode"
                      [formField]="openingBalanceForm.receivable">
      </p-input-number>
    </rts-form-field>

    <div class="flex justify-content-between">
      <rts-error-summary [regularErrorMessages]="failureMessages()"/>
      <button pButton [disabled]="openingBalanceForm().invalid()" (click)="save()">Save</button>
    </div>
  </div>
</rts-loading-container>
