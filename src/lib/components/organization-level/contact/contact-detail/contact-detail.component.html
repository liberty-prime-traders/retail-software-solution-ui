<rts-loading-container [loading]="loading()">
  <div class="flex align-items-center gap-3">
    <button pButton (click)="closed.emit()" severity="secondary" rounded text>
      <i class="pi pi-arrow-left"></i> Contacts
    </button>
    @if (contact(); as contact) {
      <h3 class="font-bold">{{ contact | contactName }}</h3>
    }
  </div>

  @if (contact(); as contact) {
    <p-tabs [(value)]="selectedTab">
      <p-tablist>
        <p-tab value="details">Details</p-tab>
        <p-tab value="ledger">Transactions</p-tab>
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="details">
          <rts-contact-form [contact]="contact"/>
        </p-tabpanel>

        <p-tabpanel value="ledger">
          @if (selectedTab() === 'ledger') {
            <rts-contact-ledger [contactId]="contact.id"/>
          }
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  } @else if (!loading()) {
    <p class="mt-4">Contact not found</p>
  }
</rts-loading-container>
