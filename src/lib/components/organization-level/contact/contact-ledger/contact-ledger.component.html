<div id="contact-ledger" [rtsAutoStretch]="'contact-ledger'">
  <p-table [value]="entries()"
           [loading]="loading()"
           (onLazyLoad)="onLazyLoad($event)"
           [lazy]="true"
           dataKey="id"
           scrollHeight="flex"
           [scrollable]="true"
           [rows]="20"
           [virtualScroll]="true"
           [virtualScrollItemSize]="55">

    <ng-template #header>
      <tr>
        <th>Date</th>
        <th>Source</th>
        <th>Reference</th>
        <th>Amount</th>
        <th>Running Balance</th>
      </tr>
    </ng-template>

    <ng-template #body let-entry>
      @if (entry?.placeholder) {
        <tr>
          <td style="height: 55px" colspan="6">
            <p-skeleton class="h-full"/>
          </td>
        </tr>
      } @else {
        <tr style="height: 55px">
          <td>{{ entry.createdOn | date }}</td>
          <td>{{ entry.sourceType | prettifyEnum }}</td>
          <td>{{ entry.sourceReferenceNumber }}</td>
          <td>
            <rts-money [amount]="entry.transactionAmount" [balanceSignal]="entry.transactionBalanceSignal"/>
          </td>
          <td>
            <rts-money [amount]="entry.netBalance" [balanceSignal]="entry.netBalanceSignal"/>
          </td>
        </tr>
      }
    </ng-template>

    <ng-template #emptymessage>
      <tr [colspan]="6" rts-empty-row message="No ledger entries recorded yet"></tr>
    </ng-template>
  </p-table>
</div>
