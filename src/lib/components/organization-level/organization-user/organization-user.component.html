<p-table [loading]="loading()"
         dataKey="id"
         sortField="user"
         #userTable
         scrollHeight="600px"
         scrollable="true"
         [value]="organizationUsers()"
         [globalFilterFields]="['user']"
         [(selection)]="selectedOrganizationUsers">

  <ng-template pTemplate="caption">
    <div class="flex justify-content-between align-items-center">
      <h3>Organization Users</h3>

      <div class="flex justify-content-end gap-6 mb-3 align-items-center">
        <p-button
                icon="pi pi-user-minus"
                label="Terminate Selected Users"
                variant="text"
                severity="danger"
                [loading]="loading()"
                [disabled]="loading() || selectedOrganizationUsers().length === 0"
                (click)="terminateSelectedUsers()">
        </p-button>

        <rts-grid-filter [dataTable]="userTable" margin="m-0"/>
      </div>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th style="width: 4rem"></th>
      <th pSortableColumn="user">Name
        <p-sortIcon field="user"></p-sortIcon>
      </th>
      <th pSortableColumn="startOn">Start On
        <p-sortIcon field="startOn"></p-sortIcon>
      </th>
      <th pSortableColumn="endOn">End On
        <p-sortIcon field="endOn"></p-sortIcon>
      </th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-organizationUser>
    <tr [pSelectableRow]="organizationUser" [ngClass]="{'inactive font-light' : !!organizationUser.endOn}">
      <td>
        @if (!organizationUser.endOn) {
          <p-tableCheckbox [value]="organizationUser"/>
        }
      </td>
      <td>
        {{ organizationUser?.user | nullSafe }}
      </td>
      <td>{{ organizationUser?.startOn | date  }}</td>
      <td>
        @if (organizationUser.endOn) {
          {{ organizationUser.endOn | date   }}
        } @else {
          <p-tag value="Active" severity="success" [rounded]="true"></p-tag>
        }
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr rts-empty-row [colspan]="4" message="No users found"></tr>
  </ng-template>
</p-table>
