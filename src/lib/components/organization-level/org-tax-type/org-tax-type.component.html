<div class="flex flex-column gap-4" id="org-tax-types" rtsAutoStretch="org-tax-types">
  @if (addingIsActive()) {
    <rts-new-form-cancel-button (onCancel)="setAddingActiveFalse()"/>
    <rts-org-tax-type-add-form (allSaved)="closeAddRow()" class="h-full"/>

  } @else {
    <p-table [loading]="loading() && !addingIsActive()"
             rowExpandMode="single"
             dataKey="id"
             scrollHeight="flex"
             [scrollable]="true"
             sortField="taxLabel"
             #orgTaxTypesTable
             [globalFilterFields]="['taxLabel']"
             (onRowExpand)="rowIsExpanded.set(true)"
             (onRowCollapse)="rowIsExpanded.set(false)"
             [value]="entities()">

      <ng-template #caption>
        <div class="flex justify-content-between align-items-center">
          <h3 class="font-bold">Tax Types</h3>

          <rts-grid-filter [dataTable]="orgTaxTypesTable"/>

          <button pButton (click)="setAddingActiveTrue()"
                  [disabled]="loading() || addingIsActive()"
                  rounded
                  severity="secondary">
            + Add Tax Types
          </button>
        </div>
      </ng-template>

      <ng-template #header>
        <tr>
          <th pSortableColumn="taxLabel">
            Tax Type
            <p-sort-icon field="taxLabel"/>
          </th>
          <th pSortableColumn="status">
            Status
            <p-sort-icon field="status"/>
          </th>
          <th>Payable Account</th>
          <th>Recoverable Account</th>
          <th style="width: 5rem"></th>
        </tr>
      </ng-template>

      <ng-template #body let-entity let-expanded="expanded">
        <tr [ngClass]="{ 'expanded-row': expanded }">
          <td>{{ entity?.taxLabel | nullSafe }}</td>
          <td>{{ entity?.status | prettifyEnum }}</td>
          <td>{{ entity?.payableAccount | nullSafe }}</td>
          <td>{{ entity?.recoverableAccount | nullSafe }}</td>
          <td>
            <button pButton
                    rounded
                    severity="secondary"
                    [disabled]="loading() || addingIsActive()"
                    [pRowToggler]="entity">
              <i [class]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"></i>
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template #expandedrow let-entity>
        <tr>
          <td colspan="5" class="filled-background">
            <rts-org-tax-type-edit-form [orgJurisdictionTaxType]="entity"/>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr rts-empty-row [colspan]="5" message="No Jurisdiction Tax Types Were Found"></tr>
      </ng-template>
    </p-table>
  }
</div>
