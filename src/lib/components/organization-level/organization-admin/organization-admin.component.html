<h3 class="font-semibold">Organization Admins</h3>

<p-divider/>

<p-table [loading]="loading()"
         dataKey="id"
         sortField="user"
         #adminTable
         [value]="organizationAdmins()"
         [globalFilterFields]="['user']"
         [(selection)]="selectedOrganizationAdmins">

  <ng-template pTemplate="caption">
    <div class="flex justify-content-end gap-6 mb-3 align-items-center">
      <span class="font-italic text-cyan-600 cursor-pointer">
        Terminate Selected Admin
      </span>

      <span class="font-italic text-bluegray-600 cursor-pointer">
        + Add Admin
      </span>

      <rts-grid-filter [dataTable]="adminTable" margin="m-0"/>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th style="width: 4rem"></th>
      <th pSortableColumn="user">Name
        <p-sortIcon field="user"></p-sortIcon>
      </th>
      <th pSortableColumn="startOn">Start On
        <p-sortIcon field="startOn"></p-sortIcon>
      </th>
      <th pSortableColumn="endOn">End On
        <p-sortIcon field="endOn"></p-sortIcon>
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-organizationAdmin>
    <tr [pSelectableRow]="organizationAdmin">
      <td>
        <p-tableCheckbox [value]="organizationAdmin" />
      </td>
      <td>{{ organizationAdmin?.user | nullSafe }}</td>
      <td>{{ organizationAdmin?.startOn | date: 'medium'}}</td>
      <td>{{organizationAdmin?.endOn | date: 'medium'}}</td>
    </tr>
  </ng-template>
</p-table>
