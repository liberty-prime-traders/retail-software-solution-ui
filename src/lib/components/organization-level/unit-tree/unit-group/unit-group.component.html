<p-table [loading]="loading() && !addingIsActive()"
         selectionMode="single"
         rowExpandMode="single"
         size="small"
         dataKey="id"
         sortField="name"
          #unitGroupsTable
          [globalFilterFields]="['name', 'description', 'createdBy']"
         (onRowExpand)="rowIsExpanded.set(true)"
         (onRowCollapse)="rowIsExpanded.set(false)"
         [(selection)]="selectedUnitGroup"
         [value]="unitGroups()">

  <ng-template pTemplate="caption">
    <rts-grid-filter [dataTable]="unitGroupsTable"/>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="name">
        Name
        <p-sortIcon field="name"></p-sortIcon>
      </th>
      <th pSortableColumn="description">
        Description
        <p-sortIcon field="description"></p-sortIcon>
      </th>
      <th pSortableColumn="createdBy">
        Created By
        <p-sortIcon field="createdBy"></p-sortIcon>
      </th>
      <th pSortableColumn="usageCount">
        Usage Count
        <p-sortIcon field="usageCount"></p-sortIcon>
      </th>
      <th style="width: 5rem"></th>
  </ng-template>

  <ng-template #body let-unitgroup let-expanded="expanded">
    <tr [pSelectableRow]="unitgroup">
      <td>{{unitgroup?.name | nullSafe}}</td>
      <td>{{unitgroup?.description | nullSafe}}</td>
      <td>{{unitgroup?.createdBy | nullSafe}}</td>
      <td>{{unitgroup?.usageCount | nullishToZero}}</td>
      <td>
        <p-button [icon]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"
                  rounded
                  severity="secondary"
                  [disabled]="processingIsUnderWay() || addingIsActive()"
                  [pRowToggler]="unitgroup">
        </p-button>
      </td>
    </tr>
  </ng-template>

  <ng-template #expandedrow let-unitgroup>
    <tr>
      <td colspan="5" class="filled-background">
        <rts-unit-group-form [unitGroup]="unitgroup"/>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="filled-background h-4rem">No Units Groups Were Found</td>
    </tr>
  </ng-template>
</p-table>

<rts-add-row [(addingIsActive)]="addingIsActive" [disabled]="rowIsExpanded() || loading()">
  @if (addingIsActive()) {
    <rts-unit-group-form></rts-unit-group-form>
  }
</rts-add-row>
