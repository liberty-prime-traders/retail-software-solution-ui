<p-tabs value="0" class="relative">

  <p-tablist>
    <div class="flex justify-content-between w-full">
      <div class="flex-grow-1">
        <p-tab value="0">Summary</p-tab>
        <p-tab value="1">Detailed View</p-tab>
        <p-tab value="2">Documentation</p-tab>
      </div>

      <p-button label="Refresh"
                icon="pi pi-refresh"
                text
                class="align-self-center"
                (click)="refresh()">
      </p-button>
    </div>
  </p-tablist>

  <p-tabpanels class="p-0">
    <p-tabpanel value="0">
      <ng-container *ngTemplateOutlet="accountsTree"/>
    </p-tabpanel>

    <p-tabpanel value="1">
      <rts-accounts-grid/>
    </p-tabpanel>

    <p-tabpanel value="2">
      <div id="accounting-guideline" rtsAutoStretch="accounting-guideline">
        <markdown style="height: inherit; overflow-y: scroll" class="block md-content" src="/assets/md/accounting-guideline.md"/>
      </div>
    </p-tabpanel>
  </p-tabpanels>
</p-tabs>

<ng-template #accountsTree>
  <div id="coaTree" rtsAutoStretch="coaTree">
    <p-tree-table [loading]="loading()"
                  [value]="accountsChart()"
                  sortField="code"
                  scrollHeight="flex"
                  [scrollable]="true">

      <ng-template pTemplate="header">
        <tr>
          <th>Account</th>
          <th>Balance</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-node let-rowData="rowData">
        <tr [ttRow]="node">
          <td>
            <div class="flex align-items-center gap-2">
              <p-treetable-toggler [rowNode]="node" />
              <span>{{ rowData.displayName }}</span>
            </div>
          </td>
          <td>
            <rts-money [amount]="rowData.currentBalance" [balanceSignal]="rowData.balanceSignal"/>
          </td>
        </tr>
      </ng-template>
    </p-tree-table>
  </div>
</ng-template>
