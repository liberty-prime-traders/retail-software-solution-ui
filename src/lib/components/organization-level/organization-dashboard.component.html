<div class="flex gap-4 mr-3 h-full">
  @if (showMenu()) {
    <div class="relative">
      <button pButton
              (click)="showMenu.set(false)"
              size="small"
              severity="secondary"
              class="absolute position-right-5 position-top-3 z-1">
        <i class="pi pi-bars"></i>
      </button>
      <p-menu [model]="menuItems()" class="block h-full filled-background"/>
    </div>

  } @else {
    <div class="pl-1">
      <button pButton (click)="showMenu.set(true)" size="small" severity="secondary"><i class="pi pi-bars"></i></button>
    </div>
  }

  <p-card class="flex-grow-1">
    <router-outlet />
  </p-card>
</div>
