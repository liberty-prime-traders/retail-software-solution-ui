<p-table  [loading]="loading() && !addingIsActive()"
          rowExpandMode="single"
          dataKey="id"
          scrollHeight="600px"
          scrollable="true"
          sortField="categoryName"
          #categoriesTable
          [globalFilterFields]="['categoryName', 'categoryType', 'description', 'createdBy']"
          (onRowExpand)="rowIsExpanded.set(true)"
          (onRowCollapse)="rowIsExpanded.set(false)"
          [value]="categories()">

  <ng-template pTemplate="caption">
    <div class="flex justify-content-between align-items-center">
      <h3>Categories</h3>
      <rts-grid-filter [dataTable]="categoriesTable"/>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="categoryName">Category Name
        <p-sortIcon field="categoryName"></p-sortIcon>
      </th>
      <th pSortableColumn="categoryType">Category Type
        <p-sortIcon field="categoryType"></p-sortIcon>
      </th>
      <th pSortableColumn="description">Description
        <p-sortIcon field="description"></p-sortIcon>
      </th>
      <th pSortableColumn="createdBy">Created By
        <p-sortIcon field="createdBy"></p-sortIcon>
      </th>
      <th style="width: 5rem"></th>
    </tr>
  </ng-template>

  <ng-template #body let-category let-expanded="expanded">
    <tr [pSelectableRow]="category">
      <td>{{ category?.categoryName | nullSafe }}</td>
      <td>{{ category?.categoryType | prettifyEnum }}</td>
      <td>{{ category?.description | nullSafe }}</td>
      <td>{{ category?.createdBy | nullSafe }}</td>
      <td>
        <p-button [icon]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"
                  rounded
                  severity="secondary"
                  [disabled]="loading() || addingIsActive()"
                  [pRowToggler]="category">
        </p-button>
      </td>
    </tr>
  </ng-template>

  <ng-template #expandedrow let-category>
    <tr>
      <td colspan="5" class="filled-background">
        <rts-category-form [category]="category"></rts-category-form>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr rts-empty-row [colspan]="5" message="No Categories Were Found"></tr>
  </ng-template>
</p-table>

<rts-add-row [(addingIsActive)]="addingIsActive" [disabled]="rowIsExpanded() || loading()">
  @if (addingIsActive()) {
    <rts-category-form></rts-category-form>
  }
</rts-add-row>
