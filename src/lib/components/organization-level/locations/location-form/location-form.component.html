<form class="flex flex-column gap-2">
  <rts-form-field [required]="true" label="Name" for="name">
    <input id="name" pInputText [formField]="locationForm.name">
  </rts-form-field>

  <rts-form-field label="Location Type" for="locationType">
    <input id="locationType" pInputText [formField]="locationForm.locationType">
  </rts-form-field>

  <rts-form-field label="Description" for="description">
    <input id="description" pInputText [formField]="locationForm.description">
  </rts-form-field>

  <rts-forms-buttons
    [disableReset]="!locationForm().dirty()"
    [disableSave]="locationForm().invalid() || !locationForm().dirty()"
    [hideDelete]="!location()?.id"
    [processingStatus]="processingStatus()"
    [failureMessages]="failureMessages()"
    [signalForm]="locationForm()"
    [fieldMap]="locationFieldMap"
    (delete)="deleteLocation()"
    (save)="upsertLocation()"
    (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
