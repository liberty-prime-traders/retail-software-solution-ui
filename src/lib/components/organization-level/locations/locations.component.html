<p-table [loading]="loading() && !addingIsActive()"
          selectionMode="single"
          rowExpandMode="single"
          dataKey="id"
          scrollHeight="600px"
          scrollable="true"
          #locationsTable
          [value]="locations()"
          [(selection)]="selectedLocation"
          [globalFilterFields]="['name', 'locationType', 'description', 'createdBy']"
          (onRowExpand)="rowIsExpanded.set(true)"
          (onRowCollapse)="rowIsExpanded.set(false)">

  <ng-template pTemplate="caption">
    <div class="flex justify-content-between align-items-center">
      <h3>Locations</h3>
      <rts-grid-filter [dataTable]="locationsTable"/>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">
        Name
        <p-sortIcon field="name"></p-sortIcon>
      </th>
      <th pSortableColumn="locationType">
        Location Type
        <p-sortIcon field="locationType"></p-sortIcon>
      </th>
      <th pSortableColumn="description">
        Description
        <p-sortIcon field="description"></p-sortIcon>
      </th>
      <th pSortableColumn="createdBy">
        Created By
        <p-sortIcon field="createdBy"></p-sortIcon>
      </th>
      <th pSortableColumn="usageCount">
        Usage Count
        <p-sortIcon field="usageCount"></p-sortIcon>
      </th>
      <th style="width: 5rem"></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-location let-expanded="expanded">
    <tr [ngClass]="{ 'expanded-row': expanded }">
      <td>{{ location?.name | nullSafe }}</td>
      <td>{{ location?.locationType | nullSafe }}</td>
      <td>{{ location?.description | nullSafe }}</td>
      <td>{{ location?.createdBy | nullSafe }}</td>
      <td>{{ location?.usageCount | nullSafe }}</td>
      <td>
        <p-button [icon]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"
                  rounded
                  severity="secondary"
                  [disabled]="loading() || addingIsActive()"
                  [pRowToggler]="location">
        </p-button>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="expandedrow" let-location>
    <tr>
      <td colspan="6" class="filled-background">
        <rts-location-form [location]="location" [organizationId]="organizationId()"/>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr rts-empty-row [colspan]="6" message="No Locations Were Found"></tr>
  </ng-template>
</p-table>

<rts-add-row [(addingIsActive)]="addingIsActive" [disabled]="rowIsExpanded() || loading()">
  @if (addingIsActive()) {
    <rts-location-form [organizationId]="organizationId()"/>
  }
</rts-add-row>
