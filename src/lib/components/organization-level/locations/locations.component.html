<p-table [loading]="loading() && !addingIsActive()"
         selectionMode="single"
         rowExpandMode="single"
         dataKey="id"
         sortField="name"
         scrollHeight="600px"
         [scrollable]="true"
         #locationsTable
         [globalFilterFields]="['name', 'description', 'locationType', 'createdBy']"
         (onRowExpand)="rowIsExpanded.set(true)"
         (onRowCollapse)="rowIsExpanded.set(false)"
         [(selection)]="selectedLocation"
         [value]="locations()">

  <ng-template pTemplate="caption">
    <div class="flex justify-content-between align-items-center">
      <h3>Locations</h3>
      <rts-grid-filter [dataTable]="locationsTable"/>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Type</th>
      <th>Created By</th>
      <th>Usage Count</th>
      <th style="width: 5rem"></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-location let-expanded="expanded">
    <tr [ngClass]="{ 'expanded-row': expanded }">
      <td>{{location?.name | nullSafe}}</td>
      <td>{{location?.description | nullSafe}}</td>
      <td>{{location?.locationType | prettifyEnum}}</td>
      <td>{{location?.createdBy | nullSafe}}</td>
      <td>{{location?.usageCount | nullishToZero}}</td>
      <td>
        <p-button [icon]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"
                  rounded
                  severity="secondary"
                  [disabled]="loading() || addingIsActive()"
                  [pRowToggler]="location">
        </p-button>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="expandedrow" let-location>
    <tr>
      <td colspan="6" class="filled-background">
        <rts-location-form [organizationId]="organizationId()" [location]="location"/>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr rts-empty-row [colspan]="6" message="No Locations are assigned to the selected organization"></tr>
  </ng-template>
</p-table>

<rts-add-row [(addingIsActive)]="addingIsActive" [disabled]="rowIsExpanded() || loading()">
  @if (addingIsActive()) {
    <rts-location-form [organizationId]="organizationId()"/>
  }
</rts-add-row>
