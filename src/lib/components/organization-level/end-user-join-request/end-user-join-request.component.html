<p-table [loading]="loading()"
         dataKey="id"
         sortField="fullName"
         scrollHeight="600px"
         scrollable="true"
         #requestsTable
         [value]="joinRequests()"
         [globalFilterFields]="['fullName', 'status']"
         [(selection)]="selectedJoinRequests">

  <ng-template #caption>
    <div class="flex justify-content-between align-items-center">
      <h3>Join Requests</h3>


      <div class="flex justify-content-end gap-6 mb-3 align-items-center">
        @if (pendingRequestsExist()) {
          <button pButton
                  severity="info"
                  variant="text"
                  [disabled]="loading() || selectedJoinRequests().length === 0"
                  (click)="admitSelectedRequests()">
            <i class="pi pi-user-plus"></i> Admit Selected
          </button>

          <button pButton
                  severity="danger"
                  variant="text"
                  [loading]="loading()"
                  [disabled]="loading() || selectedJoinRequests().length === 0"
                  (click)="rejectSelectedRequests()">
            <i class="pi pi-user-minus"></i> Reject Selected
          </button>
        }
        <rts-grid-filter [dataTable]="requestsTable" margin="m-0"/>
      </div>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      @if (pendingRequestsExist()) {
        <th style="width: 4rem"></th>
      }
      <th pSortableColumn="fullName">Name
        <p-sort-icon field="fullName"></p-sort-icon>
      </th>
      <th pSortableColumn="requestedDate">Request Date
        <p-sort-icon field="requestedDate"></p-sort-icon>
      </th>
      <th pSortableColumn="status">Status
        <p-sort-icon field="status"></p-sort-icon>
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-request>
    <tr [pSelectableRow]="request">
      @if (pendingRequestsExist()) {
        <td>
          @if (request.status === JoinRequestStatus.PENDING) {
            <p-table-checkbox [value]="request"/>
          }
        </td>
      }
      <td>{{ request?.fullName | nullSafe }}</td>
      <td>{{ request?.requestedDate | date  }}</td>
      <td>
        <p-tag [value]="request?.status | prettifyEnum"
               [severity]="request?.status | joinRequestStatusSeverity"
               class="font-normal"
               [rounded]="true">
        </p-tag>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr rts-empty-row [colspan]="4" message="No join requests found"></tr>
  </ng-template>
</p-table>
