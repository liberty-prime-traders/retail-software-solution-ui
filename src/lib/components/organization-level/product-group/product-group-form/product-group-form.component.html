<form class="flex flex-column gap-2">
  <rts-form-field [required]="true" label="Group Name" for="groupName">
    <input id="groupName" class="flex-grow-1" pInputText [field]="productGroupForm.groupName" />
  </rts-form-field>

  <rts-form-field [required]="true" label="Category" for="categoryId">
    <p-select id="categoryId"
              class="flex-grow-1"
              [options]="productCategories()"
              optionLabel="categoryName"
              optionValue="id"
              [field]="productGroupForm.categoryId"
              placeholder="Select a Category" >
    </p-select>
  </rts-form-field>

  <rts-form-field label="Description" for="description">
    <input id="description" pInputText [field]="productGroupForm.description" />
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!productGroupForm().dirty"
                     [disableSave]="productGroupForm().invalid() || !productGroupForm().dirty"
                     [hideDelete]="!originalProductGroup()?.id"
                     [signalForm]="productGroupForm()"
                     [fieldMap]="productGroupFormFields"
                     [processingStatus]="processingStatus()"
                     [failureMessages]="failureMessages()"
                     (delete)="deleteProductGroup()"
                     (save)="upsertProductGroup()"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
