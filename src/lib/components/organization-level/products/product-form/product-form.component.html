<form class="flex flex-column gap-2 filled-background pt-4 pb-2">
  <rts-form-field [required]="true" label="Product Name" for="productName">
    <input id="productName" class="flex-grow-1" pInputText [field]="productForm.productName" />
  </rts-form-field>

  <rts-form-field [required]="true" label="Category" for="categoryId">
    <p-select id="categoryId"
                class="flex-grow-1"
                [options]="productCategories()"
                optionLabel="categoryName"
                optionValue="id"
                [field]="productForm.categoryId"
                placeholder="Select a Category" >
    </p-select>
  </rts-form-field>

  <rts-form-field [required]="true" label="Base Unit" for="baseUnitId">
    <p-select id="baseUnitId"
              class="flex-grow-1"
              [options]="unitValues()"
              optionLabel="name"
              optionValue="id"
              [field]="productForm.baseUnitId"
              placeholder="Select a Unit" >
    </p-select>
  </rts-form-field>

  <rts-form-field label="Description" for="description">
    <input id="description" pInputText [field]="productForm.description" />
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!productForm().dirty"
                     [disableSave]="!productForm().valid || !productForm().dirty"
                     [hideDelete]="!product()?.id"
                     [signalForm]="productForm()"
                     [fieldMap]="productFormFields"
                     [processingStatus]="processingStatus()"
                     [failureMessages]="failureMessages()"
                     (delete)="deleteProduct()"
                     (save)="upsertProduct()"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
