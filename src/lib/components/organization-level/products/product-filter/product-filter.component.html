<form class="flex flex-column gap-2 mt-4 h-full" [formGroup]="productDataService.filterForm">

  <rts-form-field label="Reference Number" for="referenceNumber" [layout]="FormFieldDirection.VERTICAL" contentClass="col-12">
    <input placeholder="Starts with ..." id="referenceNumber" class="flex-grow-1" pInputText formControlName="referenceNumber" />
  </rts-form-field>

  <rts-form-field label="Categories" for="categoryIds" [layout]="FormFieldDirection.VERTICAL" contentClass="col-12">
    <p-multiSelect id="categoryIds"
                   class="flex-grow-1"
                   [options]="productCategories()"
                   optionLabel="categoryName"
                   optionValue="id"
                   formControlName="categoryIds"
                   placeholder="Select Categories" >
    </p-multiSelect>
  </rts-form-field>

  <rts-form-field  label="Tags" for="tagIds" [layout]="FormFieldDirection.VERTICAL" contentClass="col-12">
    <p-multiSelect id="tagIds"
                   class="flex-grow-1"
                   [options]="productTags()"
                   optionLabel="tagName"
                   optionValue="id"
                   formControlName="tagIds"
                   placeholder="Select Tags" >
    </p-multiSelect>
  </rts-form-field>

  <div class="flex flex-column gap-2">
    @for (statusOption of (ProductStatus | enumToDropdown); track statusOption.value) {
      <div class="flex align-items-center gap-2">
        <p-checkbox [value]="statusOption.value" formControlName="statusList" [inputId]="'statusOption' + $index" name="status"/>
        <label [for]="'statusOption' + $index">{{ statusOption.label }}</label>
      </div>
    }

  </div>

  <div class="h-2rem"></div>
  <div class="flex gap-3 mt-2 justify-content-end">
    <p-button label="Clear"
              icon="pi pi-times"
              class="cursor-pointer"
              (click)="productDataService.resetFilters()"
              severity="secondary">
    </p-button>

    <p-button label="Refresh Products"
              icon="pi pi-refresh"
              [disabled]="productDataService.filterForm.invalid"
              (click)="productDataService.applyFilters()"
              severity="primary">
    </p-button>
  </div>

</form>
