<span class="text-2xl font-italic">Filters:</span>

<form class="flex flex-column gap-2 mt-4" [formGroup]="filterForm">
  <rts-form-field label="Product Name" for="productName" [layout]="FormFieldDirection.VERTICAL" contentClass="col-12">
    <input id="productName" class="flex-grow-1" pInputText formControlName="productName" />
  </rts-form-field>

  <rts-form-field label="Reference Number" for="referenceNumber" [layout]="FormFieldDirection.VERTICAL" contentClass="col-12">
    <input id="referenceNumber" class="flex-grow-1" pInputText formControlName="referenceNumber" />
  </rts-form-field>

  <rts-form-field label="Category" for="categoryIds" [layout]="FormFieldDirection.VERTICAL" contentClass="col-12">
    <p-multiSelect id="categoryIds"
                   class="flex-grow-1"
                   [options]="productCategories()"
                   optionLabel="categoryName"
                   optionValue="id"
                   formControlName="categoryIds"
                   placeholder="Select Categories" >
    </p-multiSelect>
  </rts-form-field>


  <rts-form-field  label="Tags" for="tagIds" [layout]="FormFieldDirection.VERTICAL" contentClass="col-12">
    <p-multiSelect id="tagIds"
                   class="flex-grow-1"
                   [options]="productTags()"
                   optionLabel="tagName"
                   optionValue="id"
                   formControlName="tagIds"
                   placeholder="Select Tags" >
    </p-multiSelect>
  </rts-form-field>

  <rts-form-field label="Description" for="description" [layout]="FormFieldDirection.VERTICAL" contentClass="col-12">
    <input id="description" pInputText formControlName="description" />
  </rts-form-field>

  <div class="flex gap-3 mt-2 justify-content-end">
    <p-button label="Clear"
              icon="pi pi-times"
              class="cursor-pointer"
              (click)="resetFilters()"
              severity="secondary">
    </p-button>

    <p-button label="Apply"
              icon="pi pi-filter"
              (click)="applyFilters()"
              severity="primary">
    </p-button>
  </div>

</form>
