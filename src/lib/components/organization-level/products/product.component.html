<div class="flex align-items-center justify-content-between mb-3">
  <h3 class="font-bold">
    Products <span class="font-normal text-color-secondary ml-2">{{ products().length }}</span>
  </h3>

  <p-button (click)="setAddingActiveTrue()"
            [disabled]="selectedProduct() !== undefined || loading()"
            label="+ Add product"
            rounded severity="secondary">
  </p-button>

</div>

<p-divider />

<div class="flex gap-3">
  <div class="col-3">
    <rts-product-filter/>
  </div>

  <p-divider layout="vertical" />

  <div class="flex flex-column gap-4 flex-grow-1">
    @if (addingIsActive()) {
      <p-button (click)="addingIsActive.set(false)" icon="pi pi-times" severity="info"/>
      <rts-product-form></rts-product-form>
    }
    @else {
      <rts-product-details class="flex-grow-1"/>
    }
  </div>
</div>
