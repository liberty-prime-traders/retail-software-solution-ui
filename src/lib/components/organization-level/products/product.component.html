<div class="flex align-items-center justify-content-between mb-3">
  <h3 class="font-bold">
    Products <span class="font-normal text-color-secondary ml-2">{{ products().length }}</span>
  </h3>

  <rts-add-row [(addingIsActive)]="addingIsActive"
               [disabled]="selectedProduct() !== undefined || loading()"></rts-add-row>
</div>

<p-divider />

<div class="flex gap-3">
  <div class="col-3">
    <div class="shadow-1 overflow-auto" style="max-height: 600px;">
      <div class="p-2 border-bottom-1 surface-border">
        <input type="text"
               [(ngModel)]="searchTerm"
               placeholder="Search..."
               class="w-full p-inputtext p-component" />
      </div>

      @for (product of filteredProducts(); track product.id) {
        <div (click)="selectProduct(product)"
             class="p-3 surface-border cursor-pointer hover:surface-400"
             [ngClass]="{'surface-hover': selectedProduct()?.id === product.id}">

          <div class="flex justify-content-between align-items-center">
            <div class="flex flex-column">
            <span class="font-medium truncate w-12rem">
              {{ product.productName }}
            </span>
              <small>{{ product.categoryName }}</small>
            </div>
            <div class="text-right font-semibold">
              {{ product.description || '--' }}
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <p-divider layout="vertical" />

  <div class="flex justify-content-end mb-2">
    @if (selectedProduct()) {
      <p-button icon="pi pi-times"
                (click)="clearSelection()"
                rounded severity="secondary">
      </p-button>
    }
  </div>

  <rts-product-details [selectedProduct]="selectedProduct()" class="flex-grow-1"/>
</div>
