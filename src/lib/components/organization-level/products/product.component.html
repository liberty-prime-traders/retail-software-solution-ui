<h3 class="font-semibold">Products</h3>
<p-divider />

<div class="flex gap-4">
  <div class="w-2/3">
    <rts-block-ui [blocked]="addingIsActive()">
      <p-table
        [loading]="loading() && !addingIsActive()"
        dataKey="id"
        sortField="productName"
        [value]="products()"
        [globalFilterFields]="['productName', 'categoryName', 'description']"
        selectionMode="single"
        [(selection)]="selectedProduct"
        #productsTable
      >
        <ng-template pTemplate="caption">
          <rts-grid-filter [dataTable]="productsTable" />
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="productName">
              Product
              <p-sortIcon field="productName" />
            </th>
            <th pSortableColumn="categoryName">
              Category
              <p-sortIcon field="categoryName" />
            </th>
            <th pSortableColumn="description">
              Description
              <p-sortIcon field="description" />
            </th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-product>
          <tr [pSelectableRow]="product">
            <td>{{ product?.productName | nullSafe }}</td>
            <td>{{ product?.categoryName | nullSafe }}</td>
            <td>{{ product?.description || '--' }}</td>
          </tr>
        </ng-template>
      </p-table>
    </rts-block-ui>
  </div>

  <div class="w-1/3 filled-background p-3 rounded shadow-sm">
    <div class="flex justify-between mb-2">
      <p-button
        icon="pi pi-times"
        (click)="clearSelection()"
        rounded
        severity="secondary"
        *ngIf="selectedProduct || addingIsActive()"
      ></p-button>
    </div>

    <ng-container *ngIf="selectedProduct">
      <rts-product-form [product]="selectedProduct" />
    </ng-container>

    <ng-container *ngIf="addingIsActive() && !selectedProduct">
      <rts-product-form />
    </ng-container>
  </div>
</div>

<div class="mt-3">
  <rts-add-row
    [(addingIsActive)]="addingIsActive"
    [disabled]="selectedProduct !== null || loading()"
  />
</div>
