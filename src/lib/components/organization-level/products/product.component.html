<div class="flex align-items-center justify-content-between">
  <h3 class="font-bold">
    Products <span class="font-normal">({{ products().length }})</span>
  </h3>

  <rts-grid-filter [dataTable]="productsTable" />

  <rts-add-row [(addingIsActive)]="addingIsActive"
               [disabled]="selectedProduct() !== null || loading()">
  </rts-add-row>

</div>

<p-divider />

<div class="flex gap-4">
  <p-table [loading]="loading()"
           dataKey="id"
           sortField="productName"
           scrollable="true"
           scrollHeight="600px"
           class="col-4"
           [value]="products()"
           [globalFilterFields]="['productName', 'categoryName', 'description']"
           selectionMode="single"
           [(selection)]="selectedProduct"
           #productsTable>

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="productName">
          Name
          <p-sortIcon field="productName" />
        </th>
        <th>Category</th>
        <th>Description</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-product>
      <tr [pSelectableRow]="product">
        <td>{{ product?.productName | nullSafe }}</td>
        <td>{{ product?.categoryName | nullSafe }}</td>
        <td>{{ product?.description | nullSafe }}</td>
      </tr>
    </ng-template>
  </p-table>

  <p-divider layout="vertical" />

  <rts-product-details [selectedProduct]="selectedProduct()" class="flex-grow-1"/>
</div>
