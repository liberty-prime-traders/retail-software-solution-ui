<p-table [loading]="loading() && !addingIsActive()"
         rowExpandMode="single"
         dataKey="id"
         sortField="name"
         #unitValuesTable
         [globalFilterFields]="['name', 'code', 'description', 'baseUnitName']"
         (onRowExpand)="rowIsExpanded.set(true)"
         (onRowCollapse)="rowIsExpanded.set(false)"
         [value]="unitValues()">

  <ng-template pTemplate="caption">
    <div class="flex justify-content-between align-items-center">
      <h3>Unit Values</h3>
      <rts-grid-filter [dataTable]="unitValuesTable"/>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th style="width: 5rem;"></th>
      <th pSortableColumn="name">
        Name
        <p-sortIcon field="name"></p-sortIcon>
      </th>
      <th pSortableColumn="code">
        Code
        <p-sortIcon field="code"></p-sortIcon>
      </th>
      <th pSortableColumn="description">
        Description
        <p-sortIcon field="description"></p-sortIcon>
      </th>
      <th pSortableColumn="baseUnitName">
        Base Unit
        <p-sortIcon field="baseUnitName"></p-sortIcon>
      </th>
      <th pSortableColumn="conversionFactor">
        Multiplier
        <p-sortIcon field="conversionFactor"></p-sortIcon>
      </th>
  </ng-template>

  <ng-template pTemplate="body" let-unitvalue let-expanded="expanded">
    <tr [pSelectableRow]="unitvalue">
      <td>
        <p-button [icon]="expanded ? 'pi pi-angle-down' : 'pi pi-angle-right'"
                  rounded
                  pRipple
                  severity="secondary"
                  [text]="true"
                  [disabled]="loading() || addingIsActive()"
                  [pRowToggler]="unitvalue">
        </p-button>
      </td>
      <td>{{unitvalue?.name | nullSafe}}</td>
      <td>{{unitvalue?.code | nullSafe}}</td>
      <td>{{unitvalue?.description | nullSafe}}</td>
      <td>{{unitvalue?.baseUnitName | nullSafe}}</td>
      <td>{{unitvalue?.conversionFactor | nullSafe}}</td>
    </tr>
  </ng-template>

  <ng-template #expandedrow let-unitvalue>
    <tr>
      <td colspan="6" class="filled-background">
        <rts-unit-value-form [unitValue]="unitvalue"
                             [unitGroupId]="unitGroupId()"
                             [baseUnitOptions]="unitValues()">
        </rts-unit-value-form>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr rts-empty-row [colspan]="6" message="No Units Values Were Found"></tr>
  </ng-template>
</p-table>

<rts-add-row [(addingIsActive)]="addingIsActive" [disabled]="rowIsExpanded() || loading()">
  @if (addingIsActive()) {
    <rts-unit-value-form [unitGroupId]="unitGroupId()" [baseUnitOptions]="unitValues()"/>
  }
</rts-add-row>
