<form class="flex flex-column gap-2">
  <rts-form-field [required]="true" label="Name" for="name">
    <input id="name" pInputText [formField]="unitValueForm.name" />
  </rts-form-field>

  <rts-form-field [required]="true" label="Code" for="code">
    <input id="code" pInputText [formField]="unitValueForm.code" />
  </rts-form-field>

  <rts-form-field label="Description" for="description">
    <input id="description" pInputText [formField]="unitValueForm.description" />
  </rts-form-field>

  <rts-form-field label="Base Unit" [required]="unitValueForm.baseUnit().required()" for="baseUnit">
    <p-select id="baseUnit"
              showClear="true"
              optionValue="id"
              optionLabel="name"
              [options]="baseUnitOptions()"
              [formField]="unitValueForm.baseUnit">
    </p-select>
  </rts-form-field>

  <rts-form-field label="Multiplier" [required]="unitValueForm.unitsOfBasePerUnit().required()" for="unitsOfBasePerUnit">
    <p-inputNumber id="unitsOfBasePerUnit" [maxFractionDigits]="3" [formField]="unitValueForm.unitsOfBasePerUnit" />
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!unitValueForm().dirty()"
                     [disableSave]="unitValueForm().invalid() || !unitValueForm().dirty()"
                     [hideDelete]="!unitValue()?.id"
                     [signalForm]="unitValueForm()"
                     [fieldMap]="unitValueFormFields"
                     [processingStatus]="processingStatus()"
                     [failureMessages]="failureMessages()"
                     (delete)="deleteUnitValue()"
                     (save)="upsertUnitValue()"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
