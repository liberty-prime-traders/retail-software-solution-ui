<form [formGroup]="unitValueForm()" class="flex flex-column gap-2">
  <rts-form-field [required]="true" label="Name" for="name">
    <input id="name" pInputText formControlName="name">
  </rts-form-field>

  <rts-form-field [required]="true" label="Code" for="code">
    <input id="code" pInputText formControlName="code">
  </rts-form-field>

  <rts-form-field label="Description" for="description">
    <input id="description" pInputText formControlName="description">
  </rts-form-field>

  <rts-form-field label="Base Unit" [required]="conversionFactor.value !== null" for="baseUnit">
    <p-select id="baseUnit"
              formControlName="baseUnit"
              #baseUnit
              showClear="true"
              optionValue="id"
              optionLabel="name"
              [options]="baseUnitOptions()"/>
  </rts-form-field>

  <rts-form-field label="Multiplier" [required]="baseUnit.selectedOption" for="conversionFactor">
    <p-inputNumber id="conversionFactor" #conversionFactor formControlName="conversionFactor" [maxFractionDigits]="3"/>
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!unitValueForm().dirty"
                     [disableSave]="!unitValueForm().valid || !unitValueForm().dirty"
                     [hideDelete]="!unitValue()?.id"
                     [processingStatus]="processingStatus()"
                     [failureMessages]="failureMessages()"
                     (delete)="deleteUnitValue()"
                     (save)="upsertUnitValue()"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
