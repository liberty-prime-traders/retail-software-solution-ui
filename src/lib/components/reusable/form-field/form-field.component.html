<div class="flex form-field "
     [ngClass]="{
        'gap-2 align-items-center': layout() === formFieldDirection.HORIZONTAL,
        'flex-column': layout() === formFieldDirection.VERTICAL
     }">
  <label [for]="for()" class="font-semibold col-5 md:col-4 lg:col-2" [ngClass]="required() ? 'required-label' : 'pl-4'">
    {{ label() }}:
  </label>

  <div class="col-6 lg:col-4 sm:col-8 input-container">
    <ng-content/>
  </div>
</div>
