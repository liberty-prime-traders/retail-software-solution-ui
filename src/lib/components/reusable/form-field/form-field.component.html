<div [class]="containerClass() + ' flex form-field field justify-content-end'"
     [ngClass]="{
        'gap-2 align-items-center': layout() === formFieldDirection.HORIZONTAL,
        'flex-column gap-1': layout() === formFieldDirection.VERTICAL
     }">

    <label [for]="for()" class="font-semibold" [ngClass]="effectiveLabelClass()">
      {{ label() }}:
    </label>

    <div class="p-0 input-container" [ngClass]="contentClass()">
      <ng-content/>
    </div>

  <div [class]="'col-' + rightPadding()"></div>
</div>
