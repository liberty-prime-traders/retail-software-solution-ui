<div [class]="containerClass() + effectiveLayoutClass() + ' flex form-field justify-content-end'">

    <label [for]="for()" [ngClass]="effectiveLabelClass()">
      @if (layout() === FormFieldDirection.COMPACT) {
        <small class="info-message">{{ label() }}</small>
      } @else {
        {{ label() }}:
      }
    </label>

    <div class="p-0 input-container" [ngClass]="effectiveContentClass()">
      <ng-content/>
    </div>

  @if (rightPadding() > 0) {
    <div [class]="'col-' + rightPadding()"></div>
  }
</div>
