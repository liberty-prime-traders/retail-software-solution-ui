<div class="flex mt-2 gap-2">
  <p-button label="+ Add New"
            size="small"
            severity="secondary"
            (click)="addingIsActive.set(true)"
            [disabled]="addingIsActive() || disabled()">
  </p-button>

  @if (addingIsActive()) {
    <p-button (click)="addingIsActive.set(false)" icon="pi pi-times" severity="info"/>
  }
</div>

@if (addingIsActive()) {
  <div class="filled-background mb-4 mt-2">
    <ng-content/>
  </div>
}
