<div class="flex justify-content-end mb-2 gap-2">
  <p-button label="+ Add New" (click)="addingIsActive.set(true)" [disabled]="addingIsActive() || disabled()"/>

  @if (addingIsActive()) {
    <p-button (click)="addingIsActive.set(false)" icon="pi pi-times" severity="info"/>
  }
</div>

@if (addingIsActive()) {
  <div class="filled-background mb-4">
    <ng-content/>
  </div>
}
