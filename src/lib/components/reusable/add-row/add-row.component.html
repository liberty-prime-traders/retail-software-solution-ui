<div class="flex mt-2 gap-2">
  <button pButton
          size="small"
          severity="secondary"
          (click)="addingIsActive.set(true)"
          [disabled]="addingIsActive() || disabled()">
    + Add New
  </button>

  @if (addingIsActive()) {
    <button pButton (click)="addingIsActive.set(false)" severity="info"><i class="pi pi-times"></i></button>
  }
</div>

@if (addingIsActive()) {
  <div class="filled-background mb-4 mt-2 pt-3 pb-2">
    <ng-content/>
  </div>
}
