<form [formGroup]="dbVersionForm" class="flex flex-column gap-2">
  <rts-form-field label="Version Number" for="versionNumber">
    <input id="versionNumber"
           pInputText
           formControlName="versionNumber"
           [class]="{'p-invalid': dbVersionForm.controls.versionNumber.invalid && dbVersionForm.controls.versionNumber.touched}">
    @if (dbVersionForm.controls.versionNumber.invalid && dbVersionForm.controls.versionNumber.touched) {
      <small class="p-error">Version number is required</small>
    }
  </rts-form-field>

  <rts-form-field label="Previous Version" for="prevVersionId">
    <p-select id="prevVersionId"
              formControlName="prevVersionId"
              [options]="versions()"
              optionLabel="versionNumber"
              optionValue="id"
              [showClear]="true">
    </p-select>
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!dbVersionForm.dirty"
                     [disableSave]="!dbVersionForm.valid || !dbVersionForm.dirty"
                     [hideDelete]="true"
                     [processingStatus]="processingStatus()"
                     [failureMessages]="failureMessages()"
                     (save)="createDbVersion()"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
