<form
  [formGroup]="fruitForm()"
  class="flex flex-column gap-2">

  <div class="flex p-3 gap-4">
    <div class="flex gap-2 align-items-center col-5">
      <label for="name" class="font-semibold required-label">Name:</label>
      <input id="name" class="flex-grow-1" pInputText formControlName="name" />
    </div>

    <div class="flex gap-2 align-items-center col-5">
      <label for="alternateName" class="font-semibold">Alternate Name:</label>
      <input
        id="alternateName"
        class="flex-grow-1"
        pInputText
        formControlName="alternateName"
      />
    </div>
  </div>

  <div class="flex p-3 gap-4">
    <div class="flex gap-2 align-items-center col-5">
      <label for="color" class="font-semibold">Color:</label>
      <input
        id="color"
        class="flex-grow-1"
        pInputText
        formControlName="color"
      />
    </div>

    <div class="flex gap-2 align-items-center col-5">
      <label for="cost" class="font-semibold">Cost (Ksh):</label>
      <input id="cost" class="flex-grow-1" pInputText formControlName="cost" />
    </div>
  </div>

  <rts-forms-buttons
    [disableCancel]="!fruitForm().dirty"
    [disableSave]="!fruitForm().valid || !fruitForm().dirty"
    [hideDelete]="!fruit()?.id"
    cancelLabel="Reset"
    [processingStatus]="processingStatus$ | async"
    [failureMessages]="failureMessages$ | async"
    (delete)="deleteFruit(fruit()?.id)"
    (save)="upsertFruit()"
    (cancel)="resetForm()"
  >
  </rts-forms-buttons>
</form>
