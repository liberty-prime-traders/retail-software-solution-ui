<div class="flex flex-column gap-2 h-full justify-content-center align-items-center">
  <div class="text-center mb-7">
    <h1 class="text-5xl m-0">{{currentOrganization?.name | uppercase}}'S ORGANIZATION</h1>
  </div>

  @if (subdomain) {
    <p-tabs [value]="activeTab" class="w-full md:w-27rem lg:w-30rem rounded">
      <p-tablist>
          <p-tab value="locations" [routerLink]="['/landing', subdomain, 'locations']">Select Location</p-tab>
          <p-tab value="manage" [routerLink]="['/landing', subdomain, 'manage']">Manage Org</p-tab>
      </p-tablist>
      <p-tabpanels>
        <router-outlet />
      </p-tabpanels>
    </p-tabs>
  }
</div>
