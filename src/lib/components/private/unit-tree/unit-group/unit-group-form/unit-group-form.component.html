<form [formGroup]="unitGroupForm()" class="flex flex-column gap-2">
  <rts-form-field [required]="true" label="Name" for="name">
    <input id="name" pInputText formControlName="name">
  </rts-form-field>

  <rts-form-field label="Description" for="description">
    <input id="description" pInputText formControlName="description">
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!unitGroupForm().dirty"
                     [disableSave]="!unitGroupForm().valid || !unitGroupForm().dirty"
                     [hideDelete]="!unitGroup()?.id"
                     [processingStatus]="processingStatus$ | async"
                     [failureMessages]="failureMessages$ | async"
                     (delete)="deleteUnitGroup()"
                     (save)="upsertUnitGroup()"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
