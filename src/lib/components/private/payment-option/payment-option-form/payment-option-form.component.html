<form [formGroup]="paymentOptionForm()" class="flex flex-column gap-2">
  <rts-form-field label="Name" for="name">
    <input id="name" pInputText formControlName="name">
  </rts-form-field>

  <rts-form-field label="Description" for="description">
    <input id="description" pInputText formControlName="description">
  </rts-form-field>

  <rts-forms-buttons [disableCancel]="!paymentOptionForm().dirty"
                     [disableSave]="!paymentOptionForm().valid || !paymentOptionForm().dirty"
                     [hideDelete]="!paymentOption()?.id"
                     cancelLabel="Reset"
                     [processingStatus]="processingStatus$ | async"
                     [failureMessages]="failureMessages$ | async"
                     (delete)="deletePaymentOption()"
                     (save)="upsertPaymentOption()"
                     (cancelAction)="resetForm()">
  </rts-forms-buttons>
</form>
