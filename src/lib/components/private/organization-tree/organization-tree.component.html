<div class="flex flex-column gap-5">
  <p-panel header="Organizations">
    <rts-organization (selectedOrganizationChange)="organizationChange($event)"/>
  </p-panel>


  @if (selectedOrganization()) {
    <p-panel header="Locations For '{{selectedOrganization()?.name | nullSafe}}'">
      <rts-location [organizationId]="selectedOrganization()?.id"
                    (selectedLocationChange)="selectedLocation.set($event)">
      </rts-location>
    </p-panel>
  }

  @if (selectedLocation()) {
    <p-panel header="Users Assigned To '{{selectedLocation()?.name | nullSafe}}'">
      <rts-user-location [selectedLocation]="selectedLocation()?.id"/>
    </p-panel>
  }

</div>
