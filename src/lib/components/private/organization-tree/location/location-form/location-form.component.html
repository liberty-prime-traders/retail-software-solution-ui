<form [formGroup]="locationForm()" class="flex flex-column gap-2">
  <rts-form-field label="Name" for="name" layout="horizontal">
    <input id="name" class="flex-grow-1" pInputText formControlName="name">
  </rts-form-field>

  <rts-form-field label="Location Type" for="locationType" layout="horizontal">
    <p-select id="locationType"
              class="flex-grow-1"
              formControlName="locationType"
              [options]="locationType | enumToDropdown">
    </p-select>
  </rts-form-field>

  <rts-form-field label="Description" for="description" layout="horizontal">
    <input id="description" class="flex-grow-1" pInputText formControlName="description">
  </rts-form-field>

  <rts-forms-buttons [disableCancel]="!locationForm().dirty"
                     [disableSave]="!locationForm().valid || !locationForm().dirty"
                     [hideDelete]="!location()?.id"
                     cancelLabel="Reset"
                     [processingStatus]="processingStatus$ | async"
                     [failureMessages]="failureMessages$ | async"
                     (delete)="deleteLocation()"
                     (save)="upsertLocation()"
                     (cancelAction)="resetForm()">
  </rts-forms-buttons>
</form>
