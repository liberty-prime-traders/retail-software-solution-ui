<h3 class="font-semibold">Organizations</h3>

<rts-add-row [(addingIsActive)]="addingIsActive" [disabled]="rowIsExpanded() || (loading$ | async)">
  @if (addingIsActive()) {
    <rts-organization-form></rts-organization-form>
  }
</rts-add-row>

<p-table [loading]="(loading$ | async) && !addingIsActive()"
         selectionMode="single"
         rowExpandMode="single"
         size="small"
         #table
         dataKey="id"
         sortField="name"
         (onRowExpand)="rowIsExpanded.set(true)"
         (onRowCollapse)="rowIsExpanded.set(false)"
         [(selection)]="selectedOrganization"
         [value]="(organizations$ | async) ?? []">

  <ng-template #header>
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Created By</th>
      <th>Usage Count</th>
      <th style="width: 5rem"></th>
    </tr>
  </ng-template>

  <ng-template #body let-organization let-expanded="expanded">
    <tr [pSelectableRow]="organization">
      <td>{{organization?.name | nullSafe}}</td>
      <td>{{organization?.description | nullSafe}}</td>
      <td>{{organization?.createdBy | nullSafe}}</td>
      <td>{{organization?.usageCount | nullishToZero}}</td>
      <td>
        <p-button [icon]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"
                  rounded
                  severity="secondary"
                  [disabled]="(processingIsUnderWay$ | async) || addingIsActive()"
                  [pRowToggler]="organization">
        </p-button>
      </td>
    </tr>
  </ng-template>

  <ng-template #expandedrow let-organization>
    <tr>
      <td colspan="5" class="filled-background">
        <rts-organization-form [organization]="organization"/>
      </td>
    </tr>
  </ng-template>
</p-table>
