<form [formGroup]="organizationForm()" class="flex flex-column gap-2">
  <div class="flex p-3 gap-4">
    <div class="flex gap-2 align-items-center col-5">
      <label for="name" class="font-semibold required-label">Name:</label>
      <input id="name" class="flex-grow-1" pInputText formControlName="name">
    </div>

    <div class="flex gap-2 align-items-center col-5">
      <label for="description" class="font-semibold">Description:</label>
      <input id="description" class="flex-grow-1" pInputText formControlName="description">
    </div>
  </div>

  <rts-forms-buttons [disableCancel]="!organizationForm().dirty"
                     [disableSave]="!organizationForm().valid || !organizationForm().dirty"
                     [hideDelete]="!organization()?.id"
                     cancelLabel="Reset"
                     [processingStatus]="processingStatus$ | async"
                     [failureMessages]="failureMessages$ | async"
                     (delete)="deleteOrganization()"
                     (save)="upsertOrganization()"
                     (cancelAction)="resetForm()">
  </rts-forms-buttons>
</form>
