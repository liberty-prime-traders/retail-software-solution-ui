<h3 class="font-semibold">Unit Groups</h3>

<p-table [loading]="(loading$ | async) && !addingIsActive()"
         selectionMode="single"
         rowExpandMode="single"
         size="small"
         dataKey="id"
         sortField="name"
         (onRowExpand)="rowIsExpanded.set(true)"
         (onRowCollapse)="rowIsExpanded.set(false)"
         [(selection)]="selectedUnitGroup"
         [value]="(unitGroups$ | async) ?? []">

  <ng-template #header>
    <tr>
      <th pSortableColumn="name">
        Name
        <p-sortIcon field="name"></p-sortIcon>
        <p-columnFilter field="name" matchMode="contains" display="menu" [showMatchModes]="false" placeholder="Filter"></p-columnFilter>
      </th>
      <th pSortableColumn="description">
        Description
        <p-sortIcon field="description"></p-sortIcon>
        <p-columnFilter field="description" matchMode="contains" display="menu" [showMatchModes]="false" placeholder="Filter"></p-columnFilter>
      </th>
      <th pSortableColumn="createdBy">
        Created By
        <p-sortIcon field="createdBy"></p-sortIcon>
        <p-columnFilter field="createdBy" matchMode="contains" display="menu" [showMatchModes]="false" placeholder="Filter"></p-columnFilter>
      </th>
      <th pSortableColumn="usageCount">
        Usage Count
        <p-sortIcon field="usageCount"></p-sortIcon>
        <p-columnFilter field="usageCount" matchMode="equals" display="menu" [showMatchModes]="false" placeholder="Filter" type="number"></p-columnFilter>
      </th>
      <th style="width: 5rem"></th>
  </ng-template>

  <ng-template #body let-unitgroup let-expanded="expanded">
    <tr [pSelectableRow]="unitgroup">
      <td>{{unitgroup?.name | nullSafe}}</td>
      <td>{{unitgroup?.description | nullSafe}}</td>
      <td>{{unitgroup?.createdBy | nullSafe}}</td>
      <td>{{unitgroup?.usageCount | nullishToZero}}</td>
      <td>
        <p-button [icon]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"
                  rounded
                  severity="secondary"
                  [disabled]="(processingIsUnderWay$ | async) || addingIsActive()"
                  [pRowToggler]="unitgroup">
        </p-button>
      </td>
    </tr>
  </ng-template>

  <ng-template #expandedrow let-unitgroup>
    <tr>
      <td colspan="5" class="filled-background">
        <rts-unit-group-form [unitGroup]="unitgroup"/>
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="filled-background h-4rem">No Units Groups Were Found</td>
    </tr>
  </ng-template>
</p-table>

<rts-add-row [(addingIsActive)]="addingIsActive" [disabled]="rowIsExpanded() || (loading$ | async)">
  @if (addingIsActive()) {
    <rts-unit-group-form></rts-unit-group-form>
  }
</rts-add-row>
