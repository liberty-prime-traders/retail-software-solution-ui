<div class="flex gap-3 block h-full">
  @if (showNavigation) {
    <rts-navigation></rts-navigation>
  }

  <div class="flex flex-grow-1 mr-2 flex-column gap-2">
    <p-button icon="pi pi-bars" severity="secondary" (onClick)="showNavigation = !showNavigation"></p-button>

    <div [style]="{'max-height': '800px'}" class="overflow-y-scroll">
      <router-outlet/>
    </div>
  </div>
</div>
