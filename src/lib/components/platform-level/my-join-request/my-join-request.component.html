<p-button label="Back"
          icon="pi pi-arrow-left"
          class="mt-4 ml-4"
          severity="secondary"
          routerLink=".."
          (click)="goBack()">
</p-button>

<div class="mt-4 flex justify-content-center">
  <p-card class="col-11 md:col-9 lg:col-7">
    <p-table [loading]="loading()"
             dataKey="id"
             sortField="domain"
             #requestsTable
             [value]="myJoinRequests()"
             [globalFilterFields]="['domain', 'status']">

      <ng-template pTemplate="caption">
        <div class="flex flex-column gap-3 align-items-center lg:flex-row lg:justify-content-between lg:align-items-center mb-3">
          <h1 class="text-xl text-center m-0">My Join Requests</h1>
          <rts-grid-filter [dataTable]="requestsTable" margin="m-0"/>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="domain">Organization Domain
            <p-sortIcon field="domain"></p-sortIcon>
          </th>
          <th pSortableColumn="requestedDate">Request Date
            <p-sortIcon field="requestedDate"></p-sortIcon>
          </th>
          <th pSortableColumn="status">Status
            <p-sortIcon field="status"></p-sortIcon>
          </th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-request>
        <tr>
          <td>{{request?.domain | nullSafe}}</td>
          <td>{{request?.requestedDate | date: 'medium'}}</td>
          <td>
            <p-tag [value]="request?.status | prettifyEnum"
                   [severity]="request?.status | joinRequestStatusSeverity"
                   [rounded]="true">
            </p-tag>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr rts-empty-row [colspan]="3" message="No join requests found"></tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
