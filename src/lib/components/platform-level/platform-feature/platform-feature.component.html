<div class="flex flex-column gap-4 flex-grow-1" id="platformFeatures" rtsAutoStretch="platformFeatures">
  <p-table [loading]="loading()"
           rowExpandMode="single"
           dataKey="feature"
           scrollHeight="flex"
           [scrollable]="true"
           sortField="feature"
           #platformFeaturesTable
           [globalFilterFields]="['feature', 'description']"
           (onRowExpand)="rowIsExpanded.set(true)"
           (onRowCollapse)="rowIsExpanded.set(false)"
           [value]="platformFeatures()">

    <ng-template #caption>
      <div class="flex justify-content-between align-items-center">
        <h3 class="font-bold">Platform Features</h3>
        <rts-grid-filter [dataTable]="platformFeaturesTable"/>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="feature">Feature
          <p-sort-icon field="feature"/>
        </th>
        <th pSortableColumn="description">Description
          <p-sort-icon field="description"/>
        </th>
        <th style="width: 5rem"></th>
      </tr>
    </ng-template>

    <ng-template #body let-platformFeature let-expanded="expanded">
      <tr [ngClass]="{ 'expanded-row': expanded }">
        <td>{{ platformFeature?.feature | prettifyEnum }}</td>
        <td>{{ platformFeature?.description | nullSafe }}</td>
        <td>
          <button pButton
                  rounded
                  severity="secondary"
                  [disabled]="loading()"
                  [pRowToggler]="platformFeature">
            <i [class]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"></i>
          </button>
        </td>
      </tr>
    </ng-template>

    <ng-template #expandedrow let-platformFeature>
      <tr>
        <td colspan="3" class="filled-background">
          <rts-platform-feature-form [platformFeature]="platformFeature"/>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr rts-empty-row [colspan]="3" message="No Platform Features Were Found"></tr>
    </ng-template>
  </p-table>
</div>
