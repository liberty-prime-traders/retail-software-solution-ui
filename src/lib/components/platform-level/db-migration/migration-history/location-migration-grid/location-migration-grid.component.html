<div class="p-4 pt-0">
  <h5>Location Migrations</h5>

  <p-table [value]="locations()" [tableStyle]="{ 'min-width': '50rem' }" class="p-datatable-striped">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="locationName">Location
          <p-sortIcon field="locationName"/>
        </th>
        <th pSortableColumn="versionNumber">Version
          <p-sortIcon field="versionNumber"/>
        </th>
        <th pSortableColumn="startOn">Start Date
          <p-sortIcon field="startOn"/>
        </th>
        <th pSortableColumn="endOn">End Date
          <p-sortIcon field="endOn"/>
        </th>
        <th pSortableColumn="status">Status
          <p-sortIcon field="status"/>
        </th>
        <th>Message</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-location>
      <tr>
        <td>{{ location.locationName }}</td>
        <td>{{ location.versionNumber }}</td>
        <td>{{ location.startOn | timezoneAwareDate  }}</td>
        <td>{{ location.endOn | timezoneAwareDate  }}</td>
        <td>
          <p-tag [value]="location.status | prettifyEnum" [severity]="location.status | migrationStatusSeverity"/>
        </td>
        <td class="whitespace-nowrap overflow-hidden text-overflow-ellipsis">
          {{ location.message }}
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6">No location migrations found</td>
      </tr>
    </ng-template>
  </p-table>
</div>
