<div class="flex flex-column" id="dbMigration" [rtsAutoStretch]="'dbMigration'">
  <p-table [value]="migrations()"
           [loading]="loading()"
           dataKey="id"
           [scrollable]="true"
           scrollHeight="flex"
           sortField="startOn"
           [sortOrder]="-1"
           [expandedRowKeys]="expandedRows()">

    <ng-template #caption>
      <div class="flex flex-wrap justify-content-between items-center gap-2 w-full">
        <div class="flex gap-2">
          <p-date-picker [(ngModel)]="dateRange"
                         [showTime]="true"
                         [stepHour]="1"
                         selectionMode="range"
                         [readonlyInput]="true"
                         inputStyleClass="w-full"
                         [style]="{'min-width': '320px'}">
          </p-date-picker>

          <button pButton text (click)="reloadMigrationHistory()"><i class="pi pi-refresh"></i> Apply Filter</button>
        </div>

        @if (migrations().length > 1) {
          <div class="flex flex-wrap justify-content-end gap-2">
            <button pButton text (click)="expandAll()"><i class="pi pi-plus"></i> Expand All</button>
            <button pButton text (click)="collapseAll()"><i class="pi pi-minus"></i> Collapse All</button>
          </div>
        }

      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th style="width: 5rem"></th>
        <th pSortableColumn="organizationName">Organization
          <p-sort-icon field="organizationName"/>
        </th>
        <th pSortableColumn="versionNumber">Version
          <p-sort-icon field="versionNumber"/>
        </th>
        <th pSortableColumn="startOn">Start Date
          <p-sort-icon field="startOn"/>
        </th>
        <th pSortableColumn="endOn">End Date
          <p-sort-icon field="endOn"/>
        </th>
        <th pSortableColumn="status">Status
          <p-sort-icon field="status"/>
        </th>
        <th>Message</th>
      </tr>
    </ng-template>

    <ng-template #body let-migration let-expanded="expanded">
      <tr [ngClass]="{'expanded-row': expanded}">
        <td>
          <button pButton
                  type="button"
                  [pRowToggler]="migration"
                  [text]="true"
                  severity="secondary"
                  [rounded]="true">
            <i [class]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"></i>
          </button>
        </td>
        <td>{{ migration.organizationName }}</td>
        <td>{{ migration.versionNumber }}</td>
        <td>{{ migration.startOn | date   }}</td>
        <td>{{ migration.endOn | date   }}</td>
        <td>
          <p-tag [value]="migration.status | prettifyEnum"
                 [severity]="migration.status | migrationStatusSeverity">
          </p-tag>
        </td>
        <td>
          <span [pTooltip]="migration.message" class="pi pi-info-circle " tooltipStyleClass="text-sm"></span>
        </td>
      </tr>
    </ng-template>

    <ng-template #expandedrow let-migration>
      <tr>
        <td colspan="7" class="filled-background">
          <rts-location-migration-grid [locations]="migration.locations"/>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr rts-empty-row [colspan]="7" message="No DB Migrations found"></tr>
    </ng-template>
  </p-table>
</div>
