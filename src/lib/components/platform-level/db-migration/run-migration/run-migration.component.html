<form [formGroup]="migrationForm" class="flex flex-column gap-2 bg-white p-4">
  <rts-form-field label="Organization" for="schemaOwnerId" [required]="true" [layout]="FormFieldDirection.VERTICAL"
                  containerClass="" contentClass="col-12">
    <p-dropdown
      id="schemaOwnerId"
      formControlName="schemaOwnerId"
      [options]="organizations()"
      optionLabel="name"
      optionValue="id"
      [showClear]="true"
      [loading]="loadingOrganizations()"
      (onChange)="onOrganizationChange($event.value)">
    </p-dropdown>
  </rts-form-field>

  <rts-form-field label="Locations to Migrate" for="locationIdsToMigrate" [required]="true"
                  [layout]="FormFieldDirection.VERTICAL"
                  containerClass="" contentClass="col-12">
    <p-multiSelect
      id="locationIdsToMigrate"
      formControlName="locationIdsToMigrate"
      [options]="locations()"
      optionLabel="name"
      optionValue="id"
      display="chip"
      [loading]="loadingLocations()">
    </p-multiSelect>
  </rts-form-field>

  <rts-form-field label="Target DB Version" for="targetDbVersionId" [required]="true"
                  [layout]="FormFieldDirection.VERTICAL"
                  containerClass="" contentClass="col-12">
    <p-dropdown
      id="targetDbVersionId"
      formControlName="targetDbVersionId"
      [options]="dbVersions()"
      optionLabel="versionNumber"
      optionValue="id"
      [showClear]="true"
      [loading]="loadingDbVersions()">
    </p-dropdown>
  </rts-form-field>

  <rts-forms-buttons
    [disableReset]="!migrationForm.dirty"
    [disableSave]="!migrationForm.valid || !migrationForm.dirty"
    [hideDelete]="true"
    [processingStatus]="processingStatus()"
    [failureMessages]="failureMessages()"
    (save)="runMigration()"
    (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
