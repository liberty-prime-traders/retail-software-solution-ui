<div class="flex flex-column gap-4 flex-grow-1" id="jurisdictionTypes" [rtsAutoStretch]="'jurisdictionTypes'">
  @if (addingIsActive()) {
    <rts-new-form-cancel-button (onCancel)="setAddingActiveFalse()"/>
    <rts-jurisdiction-type-form (jurisdictionTypeCreated)="closeAddRow()"/>

  } @else {
    <p-table [loading]="loading() && !addingIsActive()"
             rowExpandMode="single"
             dataKey="id"
             scrollHeight="flex"
             [scrollable]="true"
             sortField="name"
             #jurisdictionTypesTable
             [globalFilterFields]="['name', 'description']"
             (onRowExpand)="rowIsExpanded.set(true)"
             (onRowCollapse)="rowIsExpanded.set(false)"
             [value]="jurisdictionTypes()">

      <ng-template pTemplate="caption">
        <div class="flex justify-content-between align-items-center">
          <h3 class="font-bold">Jurisdiction Types</h3>

          <rts-grid-filter [dataTable]="jurisdictionTypesTable"/>

          <p-button (click)="setAddingActiveTrue()"
                    [disabled]="loading() || addingIsActive()"
                    label="+ Add Jurisdiction Type"
                    rounded
                    severity="secondary">
          </p-button>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th>Reference</th>
          <th pSortableColumn="name">Name
            <p-sortIcon field="name"/>
          </th>
          <th pSortableColumn="description">Description
            <p-sortIcon field="description"/>
          </th>
          <th style="width: 5rem"></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-jurisdictionType let-expanded="expanded">
        <tr [ngClass]="{ 'expanded-row': expanded }">
          <td>{{ jurisdictionType?.referenceNumber | nullSafe }}</td>
          <td>{{ jurisdictionType?.name | nullSafe }}</td>
          <td>{{ jurisdictionType?.description | nullSafe }}</td>
          <td>
            <p-button [icon]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"
                      rounded
                      severity="secondary"
                      [disabled]="loading() || addingIsActive()"
                      [pRowToggler]="jurisdictionType">
            </p-button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="expandedrow" let-jurisdictionType>
        <tr>
          <td colspan="4" class="filled-background">
            <rts-jurisdiction-type-form [jurisdictionType]="jurisdictionType"/>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr rts-empty-row [colspan]="4" message="No Jurisdiction Types Were Found"></tr>
      </ng-template>
    </p-table>
  }
</div>
