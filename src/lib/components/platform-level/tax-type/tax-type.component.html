<div class="flex flex-column gap-4 flex-grow-1" id="taxTypes" rtsAutoStretch="taxTypes">
  @if (addingIsActive()) {
    <rts-new-form-cancel-button (onCancel)="setAddingActiveFalse()"/>
    <rts-tax-type-form (taxTypeCreated)="closeAddRow()"/>

  } @else {
    <p-table [loading]="loading() && !addingIsActive()"
             rowExpandMode="single"
             dataKey="id"
             scrollHeight="flex"
             [scrollable]="true"
             sortField="name"
             #taxTypesTable
             [globalFilterFields]="['name', 'description', 'calculationMethod']"
             (onRowExpand)="rowIsExpanded.set(true)"
             (onRowCollapse)="rowIsExpanded.set(false)"
             [value]="taxTypes()">

      <ng-template pTemplate="caption">
        <div class="flex justify-content-between align-items-center">
          <h3 class="font-bold">Tax Types</h3>

          <rts-grid-filter [dataTable]="taxTypesTable"/>

          <p-button (click)="setAddingActiveTrue()"
                    [disabled]="loading() || addingIsActive()"
                    label="+ Add Tax Type"
                    rounded
                    severity="secondary">
          </p-button>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th>Reference</th>
          <th pSortableColumn="name">Name
            <p-sortIcon field="name"/>
          </th>
          <th pSortableColumn="description">Description
            <p-sortIcon field="description"/>
          </th>
          <th pSortableColumn="calculationMethod">Calculation Method
            <p-sortIcon field="calculationMethod"/>
          </th>
          <th style="width: 5rem"></th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-taxType let-expanded="expanded">
        <tr [ngClass]="{ 'expanded-row': expanded }">
          <td>{{ taxType?.referenceNumber | nullSafe }}</td>
          <td>{{ taxType?.name | nullSafe }}</td>
          <td>{{ taxType?.description | nullSafe }}</td>
          <td>{{ taxType?.calculationMethod | prettifyEnum }}</td>
          <td>
            <p-button [icon]="expanded ? 'pi pi-times' : 'pi pi-pen-to-square'"
                      rounded
                      severity="secondary"
                      [disabled]="loading() || addingIsActive()"
                      [pRowToggler]="taxType">
            </p-button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="expandedrow" let-taxType>
        <tr>
          <td colspan="5" class="filled-background">
            <rts-tax-type-form [taxType]="taxType"/>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr rts-empty-row [colspan]="5" message="No Tax Types Were Found"></tr>
      </ng-template>
    </p-table>
  }
</div>
