<form [formGroup]="dbVersionForm" class="flex flex-column gap-2">
  <rts-form-field [required]="true" label="Version Number" for="versionNumber">
    <input id="versionNumber" pInputText formControlName="versionNumber">

    @if (dbVersionForm.controls.versionNumber.invalid && dbVersionForm.controls.versionNumber.touched) {
      @if (dbVersionForm.controls.versionNumber.errors?.['invalidFormat']) {
        <small class="text-red-500">Format must be ###.###.###</small>
      }
    }
  </rts-form-field>

  <rts-form-field label="Previous Version" for="prevVersionId" [required]="hasPreviousVersions()">
    <p-select id="prevVersionId"
              formControlName="prevVersionId"
              [options]="versions()"
              optionLabel="versionNumber"
              optionValue="id"
              [showClear]="true">
    </p-select>
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!dbVersionForm.dirty"
                     [disableSave]="!dbVersionForm.valid || !dbVersionForm.dirty"
                     [hideDelete]="true"
                     [processingStatus]="processingStatus()"
                     [failureMessages]="failureMessages()"
                     (save)="createDbVersion()"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
