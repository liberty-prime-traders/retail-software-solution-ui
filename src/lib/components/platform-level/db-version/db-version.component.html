<h3>DB Versions</h3>

<p-divider/>

<p-table [loading]="loading()" [value]="dbVersions()">
  <ng-template #header>
    <tr>
      <th>Version Number</th>
      <th>Sequence</th>
      <th>Previous Version</th>
      <th>Activated On</th>
    </tr>
  </ng-template>

  <ng-template #body let-version>
    <tr>
      <td>{{ version.versionNumber }}</td>
      <td>{{ version.sequenceNumber }}</td>
      <td>{{ version.prevVersion }}</td>
      <td>
        @if (version.activatedOn) {
          {{ version.activatedOn | date   }}
        } @else {
          <button pButton
                  [disabled]="loading()"
                  (click)="activateVersion(version.id)">
            <i class="pi pi-check"></i> Activate
          </button>
        }
      </td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr rts-empty-row [colspan]="4" message="No DB Versions found"></tr>
  </ng-template>
</p-table>
