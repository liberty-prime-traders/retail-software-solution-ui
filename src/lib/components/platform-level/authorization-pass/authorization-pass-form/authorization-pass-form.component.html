<form class="flex flex-column gap-2" [class.filled-background]="!formValue().id">
  @if (isCreatingNewPass()) {
    <rts-form-field [required]="true" label="Pass Type" for="passType">
      <p-select id="passType"
                class="flex-grow-1"
                [options]="PassType | enumToDropdown"
                [formField]="passForm.passType"
                placeholder="Select a Pass Type">
      </p-select>
    </rts-form-field>
    
    <rts-form-field [required]="true" label="Assigned To" for="assignedToId">
      <p-select id="assignedToId"
                class="flex-grow-1"
                [filter]="true"
                [options]="sysUsers()"
                optionLabel="fullName"
                optionValue="id"
                [formField]="passForm.assignedToId"
                placeholder="Who will use this pass?">
      </p-select>
    </rts-form-field>
  }

  <rts-form-field [required]="true" label="Max Use Count" for="maxUseCount">
    <p-inputNumber id="maxUseCount" [min]="1" [formField]="passForm.maxUseCount"/>
  </rts-form-field>

  <rts-form-field label="Expires On" for="expiresOn">
    <p-date-picker [formField]="passForm.expiresOn" id="expiresOn" [minDate]="tomorrow"/>
  </rts-form-field>

  <rts-forms-buttons [disableReset]="!passForm().dirty"
                     [disableSave]="passForm().invalid() || !passForm().dirty"
                     [hideDelete]="!canRevoke()"
                     deleteLabel="Revoke"
                     deleteInProgressMessage="Revoking..."
                     deleteWarning="Revoking a pass is irreversible. Are you sure you want to proceed?"
                     [signalForm]="passForm()"
                     [fieldMap]="passFormFields"
                     [processingStatus]="processingStatus()"
                     [failureMessages]="failureMessages()"
                     (delete)="revoke()"
                     (save)="upsert()"
                     (resetAction)="resetForm()">
  </rts-forms-buttons>
</form>
