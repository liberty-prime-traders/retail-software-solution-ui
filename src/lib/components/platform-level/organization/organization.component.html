<h3>Organizations</h3>

<p-divider/>

<p-table [loading]="loading()"
         dataKey="id"
         sortField="name"
         #organizationsTable
         [value]="organizations()"
         [globalFilterFields]="['name', 'subdomain', 'description']">

  <ng-template #caption>
    <div class="flex justify-content-end gap-6 mb-3 align-items-center">
      <rts-grid-filter [dataTable]="organizationsTable" margin="m-0"/>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="name">Name
        <p-sort-icon field="name"></p-sort-icon>
      </th>
      <th pSortableColumn="subdomain">Subdomain
        <p-sort-icon field="subdomain"></p-sort-icon>
      </th>
      <th pSortableColumn="description">Description
        <p-sort-icon field="description"></p-sort-icon>
      </th>
      <th pSortableColumn="createdBy">Created By
        <p-sort-icon field="createdBy"></p-sort-icon>
      </th>
      <th pSortableColumn="createdOn">Created On
        <p-sort-icon field="createdOn"></p-sort-icon>
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-organization>
    <tr>
      <td>{{organization?.name | nullSafe}}</td>
      <td>{{organization?.subdomain | nullSafe}}</td>
      <td>{{organization?.description | nullSafe}}</td>
      <td>{{organization?.createdBy}}</td>
      <td>{{organization?.createdOn | date  }}</td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr rts-empty-row [colspan]="6" message="No organizations found"></tr>
  </ng-template>
</p-table>
