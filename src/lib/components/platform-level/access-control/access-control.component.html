@if (showAuthorityAssignmentScreen()) {
  <rts-authority-assignment
    [schemaLevel]="SchemaLevel.PLATFORM"
    (cancel)="cancelAuthorityAssignment()"
    (assign)="onAuthoritiesAssigned()">
  </rts-authority-assignment>
} @else {
  <rts-platform-authorities>
    <button pButton class="mb-3" (click)="openAuthorityAssignment()">
      <i class="pi pi-plus"></i> Assign Authority
    </button>
  </rts-platform-authorities>
}
